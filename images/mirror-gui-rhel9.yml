konflux:
  cachi2:
    artifact_lockfile:
      enabled: true
      resources:
        - url: https://mirror.openshift.com/pub/cgw/oc-mirror/latest/oc-mirror-rhel9-linux-amd64.tar.gz
          filename: oc-mirror-rhel9-linux-amd64.tar.gz
        - url: https://mirror.openshift.com/pub/cgw/oc-mirror/latest/oc-mirror-rhel9-linux-arm64.tar.gz
          filename: oc-mirror-rhel9-linux-arm64.tar.gz
        - url: https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          filename: openshift-client-linux-amd64.tar.gz
        - url: https://mirror.openshift.com/pub/openshift-v4/aarch64/clients/ocp/stable/openshift-client-linux.tar.gz
          filename: openshift-client-linux-arm64.tar.gz
cachito:
  enabled: true
  packages:
    npm:
    - path: .
content:
  source:
    dockerfile: Dockerfile
    git:
      branch:
        target: main
      url: git@github.com:openshift-priv/mirror-gui.git
      web: https://github.com/openshift/mirror-gui
    pkg_managers:
    - npm
distgit:
  branch: mirror-gui-{MAJOR}.{MINOR}-rhel-9
  component: mirror-gui-rhel9-container
enabled_repos:
- rhel-9-baseos-rpms
- rhel-9-appstream-rpms
delivery:
  delivery_repo_names:
  - mirror-gui/mirror-gui-rhel9
from:
  builder:
  - stream: nodejs-22-minimal
  - stream: nodejs-22-minimal
  stream: nodejs-22-minimal
name: mirror-gui/mirror-gui-rhel9
owners:
- ybeder@redhat.com
for_payload: false
for_release: true
