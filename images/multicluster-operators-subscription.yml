cachito:
  enabled: true
  packages:
    gomod:
    - path: .
    - path: external/policy-generator-plugin
    - path: external/helm
content:
  source:
    dockerfile: build/Dockerfile.rhtap
    git:
      branch:
        target: release-2.16
      url: git@github.com:openshift-priv/stolostron-multicloud-operators-subscription.git
      web: https://github.com/stolostron/multicloud-operators-subscription
distgit:
  component: acm-multicluster-operators-subscription-container
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
delivery:
  delivery_repo_names:
  - rhacm2/multicluster-operators-subscription-rhel9
for_payload: false
dependents:
- multiclusterhub-operator
enabled_repos:
- rhel-9-baseos-rpms
- rhel-9-appstream-rpms
from:
  builder:
    - stream: rhel-9-golang
    - stream: rhel-8-golang
  stream: rhel9
name: rhacm2/multicluster-operators-subscription-rhel9
owners:
- acm-cicd@redhat.com
jira:
  project: ACM
  component: acm-multicluster-operators-subscription-container
