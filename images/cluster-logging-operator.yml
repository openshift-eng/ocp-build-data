content:
  source:
    dockerfile: Dockerfile.art
    git:
      branch:
        target: master
      url: git@github.com:openshift-priv/cluster-logging-operator.git
      web: https://github.com/openshift/cluster-logging-operator
    # Temporary: import Red Hat GPG key into the empty installroot before dnf install.
    # Hermetic Hermeto repos have gpgcheck=1 but /mnt/rootfs starts with an empty rpmdb.
    modifications:
    - action: replace
      match: "mkdir -p /mnt/rootfs && \\"
      replacement: "mkdir -p /mnt/rootfs && \\\n    rpm --root=/mnt/rootfs --import /etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release && \\"
distgit:
  component: ose-cluster-logging-operator-container
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
delivery:
  bundle_delivery_repo_name: openshift-logging/cluster-logging-operator-bundle
  delivery_repo_names:
  - openshift-logging/cluster-logging-rhel9-operator
enabled_repos:
- rhel-9-baseos-rpms
- rhel-9-appstream-rpms
from:
  builder:
    - stream: rhel-9-golang
  stream: rhel9-micro
name: openshift-logging/cluster-logging-rhel9-operator
owners:
- jcantril@redhat.com
update-csv:
  bundle-dir: manifests/
  manifests-dir: bundle/
  registry: image-registry.openshift-image-registry.svc:5000
  valid-subscription-label: '["OpenShift Kubernetes Engine", "OpenShift Container Platform", "OpenShift Platform Plus"]'
konflux:
  cachi2:
    enabled: true
jira:
  project: LOG
  component: ose-cluster-logging-operator-container
