base_image_release:
  force: true
content:
  source:
    pkg_managers: []
    dockerfile: catalog/Containerfile
    git:
      branch:
        target: main
      url: git@github.com:openshift-priv/migtools-mta-agentic-controller.git
      web: https://github.com/migtools/mta-agentic-controller
jira:
  project: MTA
  component: Analysis
distgit:
  component: mta-agent-skills-container
labels:
  distribution-scope: public
  url: https://access.redhat.com/documentation/en-us/migration_toolkit_for_applications/
delivery:
  delivery_repo_names:
  - mta/mta-agent-skills-rhel9
# The upstream catalog/Containerfile is `FROM scratch`. Give the delivered image
# a real, minimal Red Hat base (ubi9-micro) so it has a verifiable parent, RPM DB,
# and provenance for the Konflux/Conforma release policy checks that a literal
# scratch image fails. The image only COPYs skill files, so ubi-micro is enough;
# konflux.no_shell stays true because ubi-micro has no shell (no /bin/sh).
from:
  stream: rhel-9-micro
enabled_repos:
- rhel-98-appstream-rpms
- rhel-98-baseos-rpms
konflux:
#konflux:
#  no_shell: true
name: mta/mta-agent-skills-rhel9
owners:
- mta-devs@redhat.com
dependents:
  - mta-operator
