# RHEL 9.6 golang builder with cctools-port patch for BlobCore::clone()
# See: https://github.com/tpoechtrager/cctools-port/pull/191
content:
  set_build_variables: false
  source:
    path: Dockerfiles
    dockerfile: 1-25.rhel9.Dockerfile
    git:
      branch:
        target: golang
      url: git@github.com:openshift-eng/ocp-build-data.git
    modifications:
    - &add_fips_wrapper
      action: add
      doozer_source: golang_builder_FIPS_wrapper.sh
      path: go_wrapper.sh
      overwriting: true
enabled_repos:
- rhel-9-6-baseos-rpms
- rhel-9-golang-rpms
# for clang
- rhel-9-6-appstream-rpms
- rhel-9-6-codeready-builder-rpms

from:
  stream: rhel-9-6

labels:
  io.k8s.description: golang builder image for Red Hat internal builds (RHEL 9.6)

name: openshift/golang-builder
sign_golang_rpm: true

owners:
- aos-team-art@redhat.com

# for CPaaS
additional_tags:
- 'rhel_9_golang_1.25'
- 'rhel_9_1.25'
maintainer:
  component: Release

konflux:
  cachi2:
    lockfile:
      rpms:
      - golang
    artifact_lockfile:
      resources:
      - https://ocp-artifacts.engineering.redhat.com/pub/RHOCP/build-deps/openshift-golang-builder/cross.tar.gz
  content:
    source:
      modifications:
        - *add_fips_wrapper
        - action: replace
          match: "COPY cross.tar.gz "
          replacement: "RUN cp /cachi2/output/deps/generic/cross.tar.gz "
