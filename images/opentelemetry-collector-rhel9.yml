cachito:
  packages:
    gomod:
      - path: _build
      - path: .obi-src
content:
  source:
    dockerfile: Dockerfile.art
    git:
      branch:
        target: rhosdt-3.11
      url: git@github.com:openshift-priv/os-observability-redhat-opentelemetry-collector.git
      web: https://github.com/os-observability/redhat-opentelemetry-collector
distgit:
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
  component: opentelemetry-collector-rhel9-container
delivery:
  delivery_repo_names:
  - rhosdt/opentelemetry-collector-rhel9
enabled_repos:
- rhel-9-baseos-rpms
- rhel-9-appstream-rpms
for_release: true
from:
  builder:
  - stream: rhel-9-golang
  stream: rhel9
name: rhosdt/opentelemetry-collector-rhel9
name_in_bundle: opentelemetry-collector-rhel9
dependents:
- opentelemetry-rhel9-operator
owners:
- aos-team-art@redhat.com
- ocp-observability-collection-team@redhat.com
