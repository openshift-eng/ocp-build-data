arches:
- x86_64
- aarch64
- ppc64le
content:
  source:
    dockerfile: Dockerfile.ocp
    git:
      branch:
        target: release-{MAJOR}.{MINOR}
      url: git@github.com:redhat-cne/downstream-ptp-operator-monorepo.git
      web: https://github.com/redhat-cne/downstream-ptp-operator-monorepo
distgit:
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
  component: ose-ptp-operator-mono-container
  bundle_component: ose-ptp-operator-mono-metadata-container
delivery:
  # Maps to honeybadger repo_name
  repo_name: ose-ptp-operator
  bundle_delivery_repo_name: openshift4/ose-ptp-operator-bundle
  delivery_repo_names:
  - openshift4/ose-ptp-rhel9-operator
for_payload: false
from:
  builder:
  - stream: rhel-9-golang
  member: openshift-enterprise-base-rhel9
name: openshift/ose-ptp-rhel9-operator-mono
name_in_bundle: ptp-operator-mono
labels:
  summary: Operator that manages PTP (Precision Time Protocol) configuration on an openshift cluster (monorepo build)
owners:
- multus-dev@redhat.com
