content:
  set_build_variables: false
  source:
    path: Dockerfiles
    dockerfile: 1-26.rhel8.Dockerfile
    git:
      branch:
        target: golang
      url: git@github.com:openshift-eng/ocp-build-data.git
    modifications:
    - &add_fips_wrapper
      action: add
      doozer_source: golang_builder_FIPS_wrapper.sh
      path: go_wrapper.sh
      overwriting: true

distgit:
  branch: rhaos-{MAJOR}.{MINOR}-rhel-8
  component: openshift-golang-builder-container
  name: openshift-golang-builder

targets:
- rhaos-{MAJOR}.{MINOR}-rhel-8-hotfix

enabled_repos:
- rhel-8-golang-rpms
- rhel-8-10-baseos-rpms
# for clang
- rhel-8-10-appstream-rpms
- rhel-8-10-codeready-builder-rpms

from:
  stream: rhel-8-10

labels:
  io.k8s.description: golang builder image for Red Hat internal builds

name: openshift/golang-builder
sign_golang_rpm: false

owners:
- aos-team-art@redhat.com

additional_tags:
- 'rhel_8_golang_1.26'
- 'rhel_8_1.26'
maintainer:
  component: Release

konflux:
  cachi2:
    artifact_lockfile:
      resources:
      - https://ocp-artifacts.engineering.redhat.com/pub/RHOCP/build-deps/openshift-golang-builder/cross.tar.gz
  content:
    source:
      modifications:
        - *add_fips_wrapper
        - action: replace
          match: "COPY cross.tar.gz "
          replacement: "RUN cp /cachi2/output/deps/generic/cross.tar.gz "
