    git:
      branch:
        target: release-ocm-2.11
      url: git@github.com:openshift-priv/assisted-installer-agent.git
      web: https://github.com/openshift/assisted-installer-agent
distgit:
  component: mce-assisted-installer-agent-container
  branch: rhaos-{MAJOR}.{MINOR}-rhel-8
delivery:
