arches:
- x86_64
dependents:
- quay-operator
cachito:
  enabled: true
  packages:
    gomod:
    - path: config-tool
    - path: pushgateway
    npm:
    - path: web
    - path: .
    pip:
    - path: .
      requirements_files:
      - requirements.txt
      - requirements-build.txt
    cargo:
    - path: rust-builddeps
    rpm:
    - path: .
content:
  source:
    dockerfile: Containerfile.art
    git:
      branch:
        target: redhat-3.12
      url: git@github.com:openshift-priv/quay-quay.git
      web: https://github.com/quay/quay
    pkg_managers:
    - gomod
    - npm
    - pip
    - cargo
jira:
  project: PROJQUAY
  component: Quay
distgit:
  component: quay-registry-container
  branch: rhaos-{MAJOR}.{MINOR}-rhel-8
delivery:
  delivery_repo_names:
  - quay/quay-rhel8
for_payload: false
enabled_repos:
- rhel-8-appstream-rpms
- rhel-8-baseos-rpms
- rhel-8-codeready-builder-rpms
from:
  builder:
  - stream: rhel8-minimal
  - stream: rhel8-nodejs-22
  - stream: rhel8-nodejs-22
  - stream: rhel8-golang
  - stream: rhel8-golang
  - stream: rhel8-minimal
name: quay/quay-rhel8
owners:
- quay-devel@redhat.com
konflux:
  arches:
  - x86_64
  cachi2:
    lockfile:
      enabled: true
      dnf_modules_enable: true
      inspect_parent: false
  build_step_resources:
    memory: 32Gi
    cpu: 8000m
  vm_override:
    x86_64: linux-m2xlarge/amd64
canonical_builders_from_upstream: false
