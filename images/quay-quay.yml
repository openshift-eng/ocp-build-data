arches:
- x86_64
dependents:
- quay-operator
cachito:
  enabled: true
  packages:
    gomod:
    - path: config-tool
    - path: pushgateway
    npm:
    - path: web
    - path: .
    pip:
    - path: .
      requirements_files:
      - requirements.txt
      - pip-build-constraints.txt
      binary:
        py_version: '312'
    cargo:
    - path: rust-builddeps
    rpm:
    - path: .
content:
  source:
    dockerfile: Containerfile.art
    git:
      branch:
        target: redhat-3.17
      url: git@github.com:openshift-priv/quay-quay.git
      url_pull: https://github.com/shruti-rh/quay.git
      web: https://github.com/quay/quay
    pkg_managers:
    - gomod
    - npm
    - pip
    - cargo
jira:
  project: PROJQUAY
  component: Quay
distgit:
  component: quay-quay-container
delivery:
  delivery_repo_names:
  - quay/quay-rhel9
for_payload: false
enabled_repos:
- rhel-9-appstream-rpms
- rhel-9-baseos-rpms
- rhel-9-codeready-builder-rpms
from:
  builder:
  - stream: rhel9
  - stream: rhel9-nodejs-22-minimal
  - stream: rhel9-nodejs-22-minimal
  - stream: rhel-9-golang
  - stream: rhel-9-golang
  - stream: rhel9
name: quay/quay-rhel9
owners:
- quay-devel@redhat.com
konflux:
  arches:
  - x86_64
  cachi2:
    lockfile:
      enabled: true
      dnf_modules_enable: true
      modules: []
      inspect_parent: false
    artifact_lockfile:
      enabled: true
      path: .
      resources:
      - url: https://index.crates.io/config.json
      - url: https://github.com/prometheus/pushgateway/releases/download/v1.11.1/pushgateway-1.11.1.linux-amd64.tar.gz
        filename: pushgateway-1.11.1.linux-amd64.tar.gz
  build_step_resources:
    memory: 32Gi
    cpu: 8000m
  vm_override:
    x86_64: linux-m2xlarge/amd64
