arches:
- x86_64
content:
  source:
    dockerfile: Dockerfile.openshift
    git:
      branch:
        target: release-{MAJOR}.{MINOR}
      url: git@github.com:openshift-priv/ibm-vpc-node-label-updater.git
      web: https://github.com/openshift/ibm-vpc-node-label-updater
    modifications:
      # ca-certificates is installed in member openshift-enterprise-base
      # https://github.com/openshift/ibm-vpc-node-label-updater/blob/release-4.12/Dockerfile.openshift#L8
      - action: replace
        match: "yum install --setopt=tsflags=nodocs -y ca-certificates"
        replacement: "echo yum install --setopt=tsflags=nodocs -y ca-certificates"
    ci_alignment:
      streams_prs:
        ci_build_root:
          stream: rhel-8-golang-ci-build-root
        auto_label:
        - approved
        - lgtm
enabled_repos:
- rhel-8-baseos-rpms
- rhel-8-appstream-rpms
for_payload: true
from:
  builder:
  - stream: golang
  member: openshift-enterprise-base
name: openshift/ose-ibm-vpc-node-label-updater-rhel8
owners:
- aos-storage-staff@redhat.com
delivery:
  delivery_repo_names:
  - openshift4/ose-ibm-vpc-node-label-updater-rhel8
payload_name: ibm-vpc-node-label-updater
