content:
  source:
    dockerfile: Dockerfile.art
    git:
      branch:
        target: v0.54.0-rh
      url: git@github.com:openshift-priv/vector.git
      web: https://github.com/ViaQ/vector
    pkg_managers:
      - cargo
cachito:
  packages:
    cargo:
      - path: .
  flags: []
distgit:
  component: vector-container
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
delivery:
  delivery_repo_names:
  - openshift-logging/vector-rhel9
for_payload: false
dependents:
- cluster-logging-operator
enabled_repos:
- rhel-9-appstream-rpms
- rhel-9-baseos-rpms
from:
  builder:
    - member: base-rhel9
  member: base-rhel9
name: openshift-logging/vector-rhel9
owners:
- jcantril@redhat.com
konflux:
  cachi2:
    lockfile:
      backend: rpm-lockfile-prototype
    artifact_lockfile:
      resources:
      - url: https://github.com/protocolbuffers/protobuf/releases/download/v3.20.2/protoc-3.20.2-linux-aarch_64.zip
      - url: https://github.com/protocolbuffers/protobuf/releases/download/v3.20.2/protoc-3.20.2-linux-ppcle_64.zip
      - url: https://github.com/protocolbuffers/protobuf/releases/download/v3.20.2/protoc-3.20.2-linux-s390_64.zip
      - url: https://github.com/protocolbuffers/protobuf/releases/download/v3.20.2/protoc-3.20.2-linux-x86_64.zip
jira:
  project: LOG
  component: vector-container
