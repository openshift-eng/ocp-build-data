cachito:
  packages:
    gomod:
      - path: .
content:
  source:
    dockerfile: Containerfile.art
    git:
      allow_unprotected_branch: true
      branch:
        target: release-1.1
      url: git@github.com:openshift-priv/zero-trust-workload-identity-manager.git
      url_pull: https://github.com/shruti-rh/zero-trust-workload-identity-manager.git
      web: https://github.com/openshift/zero-trust-workload-identity-manager
distgit:
  component: zero-trust-workload-identity-manager-container
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
delivery:
  bundle_delivery_repo_name: zero-trust-workload-identity-manager/zero-trust-workload-identity-manager-operator-bundle
  delivery_repo_names:
    - zero-trust-workload-identity-manager/zero-trust-workload-identity-manager-rhel9
for_payload: false
enabled_repos:
  - rhel-9-appstream-rpms
  - rhel-9-baseos-rpms
from:
  builder:
    - stream: rhel-9-golang
  member: base-rhel9
name: zero-trust-workload-identity-manager/zero-trust-workload-identity-manager-rhel9
owners:
  - tgeer@redhat.com
  - mykastur@redhat.com
  - bhb@redhat.com
  - sbhor@redhat.com
update-csv:
  bundle-dir: manifests/
  manifests-dir: bundle/
  registry: image-registry.openshift-image-registry.svc:5000
  valid-subscription-label: '["OpenShift Kubernetes Engine", "OpenShift Container Platform", "OpenShift Platform Plus"]'
jira:
  project: ZTWIM
  component: Zero Trust Workload Identity Manager
