      branch:
        target: redhat-3.16
      url: git@github.com:quay/quay-konflux-components.git
      web: https://github.com/quay/quay-konflux-components
jira:
  project: PROJQUAY
  component: Operator
distgit:
  component: quay-operator-container
delivery:
  bundle_delivery_repo_name: quay/quay-operator-bundle
  delivery_repo_names:
  - quay/quay-operator-rhel9
