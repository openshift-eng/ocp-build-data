content:
  set_build_variables: false
  source:
    path: Dockerfiles
    dockerfile: 1-19.rhel19.Dockerfile
    git:
      branch:
        target: golang
      url: git@github.com:openshift-eng/ocp-build-data.git
    modifications:
    - &add_fips_wrapper
      action: add
      doozer_source: golang_builder_FIPS_wrapper.sh
      path: go_wrapper.sh
      overwriting: true
enabled_repos:
- rhel-9-golang-rpms
- rhel-90-baseos-rpms
# for clang
- rhel-90-appstream-rpms
- rhel-90-codeready-builder-rpms

from:
  stream: rhel-90

image_build_method: osbs2

labels:
  io.k8s.description: golang builder image for Red Hat internal builds

name: openshift/golang-builder

owners:
- aos-team-art@redhat.com

additional_tags:
- 'rhel_9_golang_1.19'
- 'rhel_9_1.19'
maintainer:
  component: Release

konflux:
  cachi2:
    lockfile:
      rpms:
      - golang
    artifact_lockfile:
      resources:
      - https://ocp-artifacts.engineering.redhat.com/pub/RHOCP/build-deps/openshift-golang-builder/cross.tar.gz
  content:
    source:
      modifications:
        - *add_fips_wrapper
        - action: replace
          match: "COPY cross.tar.gz "
          replacement: "RUN cp /cachi2/output/deps/generic/cross.tar.gz "
