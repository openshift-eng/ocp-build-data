cachito:
  enabled: true
content:
  source:
    dockerfile: Containerfile.art
    git:
      branch:
        target: redhat-3.17
      url: git@github.com:openshift-priv/quay-container-security-operator.git
      url_pull: https://github.com/shruti-rh/container-security-operator.git
      web: https://github.com/quay/container-security-operator
jira:
  project: PROJQUAY
  component: Container Security Operator
distgit:
  component: container-security-operator-container
delivery:
  bundle_delivery_repo_name: quay/quay-container-security-operator-bundle
  delivery_repo_names:
  - quay/quay-container-security-rhel9-operator
for_payload: false
enabled_repos:
- rhel-9-appstream-rpms
- rhel-9-baseos-rpms
from:
  builder:
  - stream: rhel-9-golang
  member: base-rhel9
name: quay/quay-container-security-rhel9-operator
owners:
- quay-devel@redhat.com
update-csv:
  bundle-dir: manifests/
  manifests-dir: bundle/
  registry: image-registry.openshift-image-registry.svc:5000
  valid-subscription-label: '["OpenShift Kubernetes Engine", "OpenShift Container Platform", "OpenShift Platform Plus"]'
