content:
  source:
    dockerfile: build/Dockerfile.rhtap
    git:
      branch:
        target: backplane-5.0
      url: git@github.com:openshift-priv/stolostron-backplane-operator.git
      web: https://github.com/stolostron/backplane-operator
distgit:
  component: mce-backplane-operator-container
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
delivery:
  delivery_repo_names:
  - multicluster-engine/backplane-rhel9-operator
  bundle_delivery_repo_name: multicluster-engine/mce-operator-bundle
enabled_repos:
- rhel-9-baseos-rpms
- rhel-9-appstream-rpms
from:
  builder:
    - stream: rhel9
    - stream: rhel-9-golang-1.26
  member: base-rhel9
name: multicluster-engine/backplane-rhel9-operator
bundle_name_override: mce-operator-bundle
update-csv:
  name: multicluster-engine
  manifests-dir: bundle
  bundle-dir: manifests
  registry: image-registry.openshift-image-registry.svc:5000
  registry-target-namespace: multicluster-engine
  valid-subscription-label: '["OpenShift Kubernetes Engine", "OpenShift Container Platform", "OpenShift Platform Plus"]'
owners:
- acm-cicd@redhat.com
