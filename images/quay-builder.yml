cachito:
  enabled: true
dependents:
- quay-operator
content:
  source:
    dockerfile: Containerfile.art
    git:
      branch:
        target: redhat-3.9
      url: git@github.com:openshift-priv/quay-quay-builder.git
      web: https://github.com/quay/quay-builder
jira:
  project: PROJQUAY
  component: Builder
distgit:
  component: quay-builder-container
  branch: rhaos-{MAJOR}.{MINOR}-rhel-8
delivery:
  delivery_repo_names:
  - quay/quay-builder-rhel8
for_payload: false
enabled_repos:
- rhel-8-appstream-rpms
- rhel-8-baseos-rpms
from:
  builder:
  - stream: rhel8-golang
  - stream: rhel8-podman
name: quay/quay-builder-rhel8
owners:
- quay-devel@redhat.com
