content:
  source:
    dockerfile: openshift-hack/images/hyperkube/Dockerfile.rhel
    git:
      branch:
        target: release-{MAJOR}.{MINOR}
      url: git@github.com:openshift-priv/kubernetes.git
      web: https://github.com/openshift/kubernetes
    modifications:
    - action: replace
      match: "COPY . ."
      replacement: "COPY . .\nRUN rm -rf unpacked_remote_sources"  # FIXME: Workaround for CLOUDBLD-8974
    - action: replace
      match: "RUN yum install -y --setopt=tsflags=nodocs --setopt=skip_missing_names_on_install=False iproute && yum clean all"
      replacement: "RUN yum install -y --setopt=tsflags=nodocs --setopt=skip_missing_names_on_install=False iproute && yum clean all\nRUN yum upgrade -y openssl openssl-libs openssl-fips-provider openssl-fips-provider-so && yum clean all"
    ci_alignment:
      streams_prs:
        ci_build_root:
          member: ci-openshift-build-root-latest.rhel9
distgit:
  namespace: containers
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
  component: openshift-enterprise-hyperkube-container
delivery:
  # Maps to honeybadger repo_name
  repo_name: ose-hyperkube
  delivery_repo_names:
  - openshift4/ose-hyperkube-rhel9
enabled_repos:
- rhel-9-appstream-rpms
- rhel-98-baseos
for_payload: true
base_image_release:
  force: true
from:
  builder:
  - stream: rhel-9-golang
  member: openshift-enterprise-base-rhel9
labels:
  License: GPLv2+
  io.k8s.description: OpenShift is a platform for developing, building, and deploying containerized applications.
  io.k8s.display-name: OpenShift Kubernetes Server Commands
  io.openshift.tags: openshift,hyperkube
name: openshift/ose-hyperkube-rhel9
payload_name: hyperkube
owners:
- aos-master@redhat.com
