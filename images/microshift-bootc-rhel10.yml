# Disable automated builds, this image is intended to be built manually like microshift rpm
mode: disabled
arches:
- x86_64
- aarch64
content:
  source:
    dockerfile: packaging/imagemode/Containerfile.repobase
    modifications:
    - action: replace
      match: "ARG BASE_IMAGE_URL"
      replacement: "ARG BASE_IMAGE_URL='registry.redhat.io/rhel10/rhel-bootc'"
    - action: replace
      match: "ARG BASE_IMAGE_TAG"
      replacement: "ARG BASE_IMAGE_TAG='10.2'"
    - action: replace
      match: "RUN dnf install"
      replacement: |
        RUN rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release && \
            dnf install \
    git:
      branch:
        target: release-{MAJOR}.{MINOR}
      url: git@github.com:openshift-priv/microshift.git
      web: https://github.com/openshift/microshift
    ci_alignment:
      streams_prs:
        enabled: false
delivery:
  delivery_repo_names:
  - openshift5/microshift-bootc-rhel10
distgit:
  branch: rhaos-{MAJOR}.{MINOR}-rhel-10
# This image has its own separate release process, see USHIFT-4024
for_release: false
for_payload: false
enabled_repos:
- rhel-102-baseos
- rhel-102-appstream
- rhel-102-fast-datapath
- rhel-9-server-microshift-rpms
name: openshift/microshift-bootc-rhel10
canonical_builders_from_upstream: false
owners:
- microshift-devel@redhat.com
