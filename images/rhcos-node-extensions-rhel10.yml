content:
  source:
    dockerfile: extensions/Containerfile
    git:
      branch:
        target: release-{MAJOR}.{MINOR}
      url: git@github.com:openshift-priv/os.git
      web: https://github.com/openshift/os
    ci_alignment:
      streams_prs:
        enabled: false
      mirror: false
    modifications:
    - action: replace
      match: "ARG STREAM_CLASS"
      replacement: "ARG STREAM_CLASS=rhel-10"
    - action: replace
      match: "RUN --mount=type=secret,id=yumrepos,target=/os/secret.repo extensions/build.sh"
      replacement: |
        RUN if false; then \
                dnf install -y \
                    libreswan \
                    NetworkManager-libreswan \
                    openvswitch3.5-ipsec \
                    usbguard \
                    krb5-workstation \
                    libkadm5 \
                    kernel-devel \
                    kernel-headers \
                    kernel \
                    kernel-core \
                    kernel-modules \
                    kernel-modules-core \
                    kernel-modules-extra \
                    sysstat \
                    pacemaker \
                    pcs \
                    fence-agents-all; \
                if [ "$(uname -m)" = "x86_64" ]; then \
                    dnf install -y \
                        kernel-rt-core \
                        kernel-rt-modules \
                        kernel-rt-modules-core \
                        kernel-rt-modules-extra \
                        kernel-rt-devel; \
                fi; \
                if [ "$(uname -m)" = "x86_64" ] || [ "$(uname -m)" = "s390x" ]; then \
                    dnf install -y kata-containers; \
                fi; \
                if [ "$(uname -m)" = "aarch64" ]; then \
                    dnf install -y \
                        kernel-64k-core \
                        kernel-64k-modules \
                        kernel-64k-modules-core \
                        kernel-64k-modules-extra \
                        kernel-64k-devel; \
                fi; \
            fi && \
            rm -f /os/c10s.repo && touch /os/empty.repo && \
            rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release && \
            sed -e 's/--repo="${repo_list}"//' extensions/build.sh | bash
distgit:
  branch: rhaos-{MAJOR}.{MINOR}-rhel-10
  component: rhcos-node-extensions-container
enabled_repos:
- rhel-102-baseos
- rhel-102-appstream
- rhel-10-server-ose-rpms
- rhel-102-highavailability
- rhel-102-fast-datapath
- rhel-102-nfv
for_payload: false
for_release: false
from:
  builder:
    - member: rhcos-node-image-rhel10
    - member: openshift-enterprise-base-rhel10
  member: openshift-enterprise-base-rhel10
name: openshift/rhcos-node-extensions-rhel10
owners:
- aos-team-art@redhat.com
canonical_builders_from_upstream: false
konflux:
  cachi2:
    lockfile:
      rpms:
      - libreswan
      - NetworkManager-libreswan
      - openvswitch3.5-ipsec
      - usbguard
      - krb5-workstation
      - libkadm5
      - kernel-devel
      - kernel-headers
      - kernel
      - kernel-core
      - kernel-modules
      - kernel-modules-core
      - kernel-modules-extra
      - kernel-rt-core
      - kernel-rt-modules
      - kernel-rt-modules-core
      - kernel-rt-modules-extra
      - kernel-rt-devel
      - kata-containers
      - kernel-64k-core
      - kernel-64k-modules
      - kernel-64k-modules-core
      - kernel-64k-modules-extra
      - kernel-64k-devel
      - sysstat
      - pacemaker
      - pcs
      - fence-agents-all
  image_repo: quay.io/redhat-user-workloads/ocp-art-tenant/art-rhcos-images
  skip_validate_slsa: true
okd:
  mode: disabled
