cachito:
  enabled: true
  packages:
    gomod:
    - path: .
    - path: promu/
content:
  source:
    dockerfile: Containerfile.operator
    git:
      branch:
        target: release-5.0
      url: git@github.com:openshift-priv/stolostron-memcached_exporter.git
      web: https://github.com/stolostron/memcached_exporter
distgit:
  component: acm-memcached-exporter-container
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
delivery:
