# ART-22737: delivery image that carries the openshift-install tarballs under /releases/ for the Konflux
# push-artifacts-to-cdn pipeline (see delivery_images/installer/). Only the installer-cdn-release job
# builds it, after promote, with the release values as build args; mode: disabled keeps every other
# build away from it.
mode: disabled
arches:
- x86_64
canonical_builders_from_upstream: false
content:
  source:
    dockerfile: Dockerfile
    path: delivery_images/installer
    git:
      branch:
        target: openshift-{MAJOR}.{MINOR}
      url: git@github.com:openshift-priv/ocp-build-data.git
      web: https://github.com/openshift-eng/ocp-build-data
    ci_alignment:
      streams_prs:
        enabled: false
distgit:
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
  component: openshift-install-delivery-container
for_payload: false
for_release: false
from:
  builder:
  - member: ose-installer
  - member: ose-installer
  - member: ose-installer
  - member: ose-installer
  - member: ose-installer-artifacts
  - member: ose-installer-artifacts
  - member: ose-installer-artifacts
  - member: ose-installer-artifacts
  - member: ose-baremetal-installer
  - member: ose-baremetal-installer
  - member: ose-baremetal-installer
  - member: ose-baremetal-installer
  stream: rhel9
konflux:
  allow_cross_platform_images: true
  cachi2:
    enabled: false
  network_mode: hermetic
  no_shell: true
  vm_override:
    x86_64: linux-d320-m8xlarge/amd64
name: openshift/openshift-install-delivery-rhel9
owners:
- aos-team-art@redhat.com
