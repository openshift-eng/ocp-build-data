    dockerfile: images/cli/Dockerfile.konflux
    git:
      branch:
        target: main
      url: git@github.com:openshift-priv/oc-mirror.git
      web: https://github.com/openshift/oc-mirror
distgit:
  branch: oc-mirror-{MAJOR}.{MINOR}-rhel-9
  component: oc-mirror-container
from:
