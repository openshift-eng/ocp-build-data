content:
  source:
    dockerfile: images/router/haproxy/Dockerfile.ocp
    git:
      branch:
        target: release-{MAJOR}.{MINOR}
      url: git@github.com:openshift-priv/router.git
      web: https://github.com/openshift/router
distgit:
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
  component: openshift-enterprise-haproxy-router-container
delivery:
  # Maps to honeybadger repo_name
  repo_name: ose-haproxy-router
  delivery_repo_names:
  - openshift5/ose-haproxy-router-rhel9
enabled_repos:
- rhel-9-baseos-rpms
- rhel-9-appstream-rpms
- rhel-9-server-ose-rpms-embargoed
for_payload: true
from:
  member: ose-haproxy-router-base
canonical_builders_from_upstream: false
labels:
  License: GPLv2+
  io.k8s.description: This is a component of OpenShift Container Platform and contains an HAProxy instance that automatically exposes services within the cluster through routes, and offers TLS termination, reencryption, or SNI-passthrough on ports 80 and 443.
  io.k8s.display-name: OpenShift Container Platform HAProxy Router
  io.openshift.tags: openshift,router,haproxy
name: openshift/ose-haproxy-router-rhel9
payload_name: haproxy-router
owners:
- aos-network-edge@redhat.com
okd:
  content:
    source:
      modifications:
        - action: replace
          match: |
            RUN INSTALL_PKGS="socat haproxy32 rsyslog procps-ng util-linux" && \
                yum install -y --setopt=install_weak_deps=0 $INSTALL_PKGS && \
                rpm -V $INSTALL_PKGS && \
                yum clean all && \
                mkdir -p /var/lib/haproxy/router/{certs,cacerts,allowlists} && \
                mkdir -p /var/lib/haproxy/{conf/.tmp,run,bin,log,mtls} && \
                touch /var/lib/haproxy/conf/{{os_http_be,os_edge_reencrypt_be,os_tcp_be,os_sni_passthrough,os_route_http_redirect,cert_config,os_wildcard_domain}.map,haproxy.config} && \
                setcap 'cap_net_bind_service=ep' /usr/sbin/haproxy && \
                chown -R :0 /var/lib/haproxy && \
                chmod -R g+w /var/lib/haproxy && \
                sed -i 's/SECLEVEL=2/SECLEVEL=1/g' /etc/crypto-policies/back-ends/opensslcnf.config
          replacement: |
            RUN HAPROXY_VERSION=3.2.6 && \
                BUILD_PKGS="gcc make pcre2-devel openssl-devel systemd-devel" && \
                yum install -y --setopt=install_weak_deps=0 socat rsyslog procps-ng util-linux $BUILD_PKGS && \
                curl -fsSL "https://www.haproxy.org/download/${HAPROXY_VERSION%.*}/src/haproxy-${HAPROXY_VERSION}.tar.gz" -o /tmp/haproxy.tar.gz && \
                mkdir -p /usr/src/haproxy && tar -xzf /tmp/haproxy.tar.gz -C /usr/src/haproxy --strip-components=1 && \
                make -C /usr/src/haproxy -j"$(nproc)" TARGET=linux-glibc USE_OPENSSL=1 USE_PCRE2=1 USE_SYSTEMD=1 && \
                make -C /usr/src/haproxy install-bin PREFIX=/usr && \
                rm -rf /usr/src/haproxy /tmp/haproxy.tar.gz && \
                yum remove -y $BUILD_PKGS && \
                yum clean all; \
                mkdir -p /var/lib/haproxy/router/{certs,cacerts,allowlists} && \
                mkdir -p /var/lib/haproxy/{conf/.tmp,run,bin,log,mtls} && \
                touch /var/lib/haproxy/conf/{{os_http_be,os_edge_reencrypt_be,os_tcp_be,os_sni_passthrough,os_route_http_redirect,cert_config,os_wildcard_domain}.map,haproxy.config} && \
                setcap 'cap_net_bind_service=ep' /usr/sbin/haproxy && \
                chown -R :0 /var/lib/haproxy && \
                chmod -R g+w /var/lib/haproxy && \
                sed -i 's/SECLEVEL=2/SECLEVEL=1/g' /etc/crypto-policies/back-ends/opensslcnf.config
  distgit:
    branch: rhaos-5.0-rhel-9
