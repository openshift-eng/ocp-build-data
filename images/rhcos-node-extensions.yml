content:
  source:
    dockerfile: extensions/Containerfile
    git:
      branch:
        target: release-{MAJOR}.{MINOR}
      url: git@github.com:openshift-priv/os.git
      web: https://github.com/openshift/os
    ci_alignment:
      streams_prs:
        enabled: false
      mirror: false
    modifications:
    - action: replace
      match: "ARG STREAM_CLASS"
      replacement: "ARG STREAM_CLASS=rhel-9"
    - action: replace
      match: "RUN --mount=type=secret,id=yumrepos,target=/os/secret.repo extensions/build.sh"
      replacement: |
        RUN rm -f /os/c10s.repo && touch /os/empty.repo && \
            rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release && \
            sed -e 's/--repo="${repo_list}"//' extensions/build.sh | bash
distgit:
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
  component: rhcos-node-extensions-container
enabled_repos:
- rhel-9-baseos-rpms
- rhel-9-appstream-rpms
- rhel-9-fast-datapath-rpms
- rhel-9-server-ose-rpms
- rhel-9-nfv
- rhel-9-highavailability
for_payload: false
for_release: false
from:
  builder:
    - member: rhcos-node-image
    - member: openshift-enterprise-base-rhel9
  member: openshift-enterprise-base-rhel9
name: openshift/rhcos-node-extensions-rhel9
owners:
- aos-team-art@redhat.com
canonical_builders_from_upstream: false
konflux:
  cachi2:
    lockfile:
      rpms:
      - libreswan
      - NetworkManager-libreswan
      - openvswitch3.5-ipsec
      - usbguard
      - krb5-workstation
      - libkadm5
      - kernel-devel
      - kernel-headers
      - kernel
      - kernel-core
      - kernel-modules
      - kernel-modules-core
      - kernel-modules-extra
      - kernel-rt-core
      - kernel-rt-modules
      - kernel-rt-modules-core
      - kernel-rt-modules-extra
      - kernel-rt-devel
      - kata-containers
      - kernel-64k-core
      - kernel-64k-modules
      - kernel-64k-modules-core
      - kernel-64k-modules-extra
      - sysstat
      - pacemaker
      - pcs
      - fence-agents-all
  image_repo: quay.io/redhat-user-workloads/ocp-art-tenant/art-rhcos-images
  skip_validate_slsa: true
okd:
  mode: disabled
