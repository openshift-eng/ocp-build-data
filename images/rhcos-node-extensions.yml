content:
  source:
    dockerfile: extensions/Containerfile
    git:
      branch:
        target: release-{MAJOR}.{MINOR}
      url: git@github.com:openshift-priv/os.git
      web: https://github.com/openshift/os
    ci_alignment:
      streams_prs:
        enabled: false
      mirror: false
    modifications:
    - action: replace
      match: "ARG STREAM_CLASS"
      replacement: "ARG STREAM_CLASS=rhel9"
    - action: replace
      match: "RUN --mount=type=secret,id=yumrepos,target=/os/secret.repo extensions/build.sh"
      replacement: |
        RUN if false; then \
                dnf install -y \
                    libreswan \
                    NetworkManager-libreswan \
                    openvswitch3.5-ipsec \
                    usbguard \
                    krb5-workstation \
                    libkadm5 \
                    kernel-devel \
                    kernel-headers \
                    kernel \
                    kernel-core \
                    kernel-modules \
                    kernel-modules-core \
                    kernel-modules-extra \
                    sysstat \
                    pacemaker \
                    pcs \
                    fence-agents-all; \
                if [ "$(uname -m)" = "x86_64" ]; then \
                    dnf install -y \
                        kernel-rt-core \
                        kernel-rt-modules \
                        kernel-rt-modules-core \
                        kernel-rt-modules-extra \
                        kernel-rt-devel; \
                fi; \
                if [ "$(uname -m)" = "x86_64" ] || [ "$(uname -m)" = "s390x" ]; then \
                    dnf install -y kata-containers; \
                fi; \
                if [ "$(uname -m)" = "aarch64" ]; then \
                    dnf install -y \
                        kernel-64k-core \
                        kernel-64k-modules \
                        kernel-64k-modules-core \
                        kernel-64k-modules-extra; \
                fi; \
            fi && \
            rm -f /os/c10s.repo && touch /os/empty.repo && \
            rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release && \
            sed -e 's/--repo="${repo_list}"//' \
                -e '/^kernel_evr=/,/^echo "kernel-devel-/d' \
                -e "s/for subcommand in 'install' 'reinstall'; do/for subcommand in 'install'; do/" \
                -e '/^# Clear the versionlock/i\
            installed_kernel_packages=; for package in kernel kernel-core kernel-modules kernel-modules-core kernel-modules-extra kernel-devel kernel-headers kernel-rt-core kernel-rt-modules kernel-rt-modules-core kernel-rt-modules-extra kernel-rt-devel kernel-64k-core kernel-64k-modules kernel-64k-modules-core kernel-64k-modules-extra; do if rpm -q "$package" >/dev/null 2>&1; then installed_kernel_packages="$installed_kernel_packages $package"; fi; done; if [ -n "$installed_kernel_packages" ]; then if ! dnf --disableplugin=versionlock reinstall --assumeyes --nobest --downloadonly --setopt=skip_if_unavailable=True --destdir="$destdir" $installed_kernel_packages; then dnf --disableplugin=versionlock upgrade --assumeyes --nobest --downloadonly --setopt=skip_if_unavailable=True --destdir="$destdir" $installed_kernel_packages; fi; fi' \
                extensions/build.sh | bash
distgit:
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
  component: rhcos-node-extensions-container
enabled_repos:
- rhel-9-baseos-rpms
- rhel-9-appstream-rpms
- rhel-9-fast-datapath-rpms
- rhel-9-server-ose-rpms
- rhel-9-nfv
- rhel-9-highavailability
for_payload: false
for_release: false
from:
  builder:
    - member: rhcos-node-image
    - member: openshift-enterprise-base-rhel9
  member: openshift-enterprise-base-rhel9
name: openshift/rhcos-node-extensions-rhel9
owners:
- aos-team-art@redhat.com
canonical_builders_from_upstream: false
konflux:
  image_repo: quay.io/redhat-user-workloads/ocp-art-tenant/art-rhcos-images
okd:
  mode: disabled
