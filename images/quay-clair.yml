cachito:
  enabled: true
konflux:
  cachi2:
    artifact_lockfile:
      enabled: true
      path: .
      resources:
      - url: https://raw.githubusercontent.com/quay/quay-konflux-components/redhat-3.17/components/clair/data/repository-to-cpe.json
        filename: repository-to-cpe.json
      - url: https://raw.githubusercontent.com/quay/quay-konflux-components/redhat-3.17/components/clair/data/container-name-repos-map.json
        filename: container-name-repos-map.json
dependents:
- quay-operator
content:
  source:
    dockerfile: contrib/art/Containerfile.art
    git:
      branch:
        target: release-4.8
      url: git@github.com:openshift-priv/quay-clair.git
      url_pull: https://github.com/shruti-rh/clair.git
      web: https://github.com/quay/clair
jira:
  project: PROJQUAY
  component: Clair
distgit:
  component: quay-clair-container
delivery:
  delivery_repo_names:
  - quay/clair-rhel9
for_payload: false
enabled_repos:
- rhel-9-appstream-rpms
- rhel-9-baseos-rpms
from:
  builder:
  - stream: rhel-9-golang
  member: base-rhel9
name: quay/clair-rhel9
owners:
- quay-devel@redhat.com
