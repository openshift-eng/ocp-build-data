cachito:
  enabled: true
konflux:
  cachi2:
    artifact_lockfile:
      enabled: true
      path: .
      resources:
      - url: https://www.redhat.com/security/data/metrics/repository-to-cpe.json
        filename: repository-to-cpe.json
      - url: https://www.redhat.com/security/data/metrics/container-name-repos-map.json
        filename: container-name-repos-map.json
dependents:
- quay-operator
content:
  source:
    dockerfile: contrib/art/Containerfile.art
    git:
      branch:
        target: release-4.9
      url: git@github.com:openshift-priv/quay-clair.git
      web: https://github.com/quay/clair
jira:
  project: PROJQUAY
  component: Clair
distgit:
  component: clair-container
  branch: rhaos-{MAJOR}.{MINOR}-rhel-8
delivery:
  delivery_repo_names:
  - quay/clair-rhel8
for_payload: false
enabled_repos:
- rhel-8-appstream-rpms
- rhel-8-baseos-rpms
from:
  builder:
  - stream: rhel8-golang
  member: base-rhel8
name: quay/clair-rhel8
owners:
- quay-devel@redhat.com
