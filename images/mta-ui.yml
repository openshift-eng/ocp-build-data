cachito:
  packages:
    npm:
      - path: .
content:
  source:
    dockerfile: konflux.Dockerfile
    git:
      branch:
        target: main
      url: git@github.com:openshift-priv/migtools-mta-tackle2-ui.git
      web: https://github.com/migtools/mta-tackle2-ui
    modifications:
      # https://github.com/migtools/mta-tackle2-ui/blob/main/konflux.Dockerfile#L21
      - action: replace
        match: "dnf -y install"
        replacement: "dnf -y update && dnf -y install"
jira:
  project: MTA
  component: UI
distgit:
  component: mta-ui-container
delivery:
  delivery_repo_names:
  - mta/mta-ui-rhel10
for_payload: false
enabled_repos:
- rhel-10-appstream-rpms
- rhel-10-baseos-rpms
from:
  builder:
    - stream: rhel-10-nodejs-22
  stream: rhel-10-nodejs-22
name: mta/mta-ui-rhel10
owners:
- mta-devs@redhat.com
dependents:
  - mta-operator
