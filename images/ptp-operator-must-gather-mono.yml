arches:
- x86_64
- aarch64
- ppc64le
content:
  source:
    dockerfile: Dockerfile.ocp
    git:
      branch:
        target: release-{MAJOR}.{MINOR}
      url: git@github.com:redhat-cne/downstream-ptp-operator-monorepo.git
      web: https://github.com/redhat-cne/downstream-ptp-operator-monorepo
    path: must-gather
distgit:
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
  component: ptp-operator-must-gather-mono-container
dependents:
- ptp-operator-mono
name_in_bundle: ptp-operator-must-gather-mono
delivery:
  # Maps to honeybadger repo_name
  repo_name: ptp-must-gather-mono
  delivery_repo_names:
  - openshift4/ptp-must-gather-rhel9-mono
for_payload: false
from:
  builder:
  - stream: rhel-9-golang
  member: ose-must-gather
name: openshift/ptp-must-gather-rhel9-mono
owners:
- multus-dev@redhat.com
