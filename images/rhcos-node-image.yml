content:
  source:
    dockerfile: Containerfile
    git:
      branch:
        target: release-{MAJOR}.{MINOR}
      url: git@github.com:openshift-priv/os.git
      web: https://github.com/openshift/os
    ci_alignment:
      streams_prs:
        enabled: false
      mirror: false
distgit:
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
  component: rhcos-node-image-container
enabled_repos:
- rhel-9.8-baseos
- rhel-9.8-appstream
- rhel-9.8-early-kernel
- rhel-9.8-fast-datapath
- rhel-9.8-server-ose-4.22
for_payload: false
for_release: false
from:
  builder:
    - stream: rhel_coreos
name: openshift/rhcos-node-image-rhel9
owners:
- aos-team-art@redhat.com
canonical_builders_from_upstream: false
konflux:
  network_mode: open
okd:
  mode: disabled
