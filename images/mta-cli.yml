cachito:
  packages:
    gomod:
      - path: .
content:
  source:
    dockerfile: konflux.Dockerfile
    git:
      branch:
        target: release-0.9
      url: git@github.com:openshift-priv/migtools-mta-kantra.git
      web: https://github.com/migtools/mta-kantra
    modifications:
      # Remove FIPS flags from linux build; the golang-builder handles FIPS natively
      - action: replace
        match: "CGO_ENABLED=0 GOOS=linux GOEXPERIMENT=strictfipsruntime go build -tags strictfipsruntime"
        replacement: "CGO_ENABLED=0 GOOS=linux go build"
jira:
  project: MTA
  component: MTA CLI
distgit:
  component: mta-cli-container
delivery:
  delivery_repo_names:
  - mta/mta-cli-rhel9
enabled_repos:
- rhel-9-appstream-rpms
- rhel-9-baseos-rpms
envs:
  GOFLAGS: "-mod=mod"
from:
  builder:
    - stream: rhel-9-golang
    - member: base-rhel9
    - member: mta-static-report
    - member: mta-analyzer-lsp
    - member: mta-generic-external-provider
  member: mta-java-external-provider
name: mta/mta-cli-rhel9
owners:
- mta-devs@redhat.com
dependents:
  - mta-operator
konflux:
  cachi2:
    lockfile:
      dnf_modules_enable: false # disable automatic injection
