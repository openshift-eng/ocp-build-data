cachito:
  packages:
    gomod:
      - path: .
content:
  source:
    dockerfile: konflux.Dockerfile
    git:
      branch:
        target: release-0.10
      url: git@github.com:openshift-priv/migtools-mta-kantra.git
      web: https://github.com/migtools/mta-kantra
jira:
  project: MTA
  component: MTA CLI
distgit:
  component: mta-cli-container
delivery:
  delivery_repo_names:
  - mta/mta-cli-rhel9
for_payload: false
enabled_repos:
- rhel-98-appstream-rpms
- rhel-98-baseos-rpms
from:
  builder:
    - stream: rhel-9-golang
    - member: base-rhel9
    - member: mta-static-report
    - member: mta-analyzer-lsp
    - member: mta-go-external-provider
    - member: mta-python-external-provider
    - member: mta-nodejs-external-provider
  member: mta-java-external-provider
name: mta/mta-cli-rhel9
owners:
- mta-devs@redhat.com
dependents:
  - mta-operator
konflux:
  cachi2:
    lockfile:
      dnf_modules_enable: false # disable automatic injection
      modules:
      - nodejs:18
