cachito:
  packages:
    gomod:
      - path: .
content:
  source:
    dockerfile: Containerfile.art
    git:
      allow_unprotected_branch: true
      branch:
        target: release/v0.2.8
      url: git@github.com:openshift-priv/spiffe-spiffe-csi.git
      url_pull: https://github.com/shruti-rh/spiffe-spiffe-csi.git
      web: https://github.com/openshift/spiffe-spiffe-csi
distgit:
  component: spiffe-csi-driver-container
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
delivery:
  delivery_repo_names:
    - zero-trust-workload-identity-manager/spiffe-csi-driver-rhel9
enabled_repos:
  - rhel-9-appstream-rpms
  - rhel-9-baseos-rpms
from:
  builder:
    - stream: rhel-9-golang
  member: base-rhel9
name: zero-trust-workload-identity-manager/spiffe-csi-driver-rhel9
owners:
  - tgeer@redhat.com
  - mykastur@redhat.com
  - bhb@redhat.com
  - sbhor@redhat.com
dependents:
  - zero-trust-workload-identity-manager
jira:
  project: ZTWIM
  component: Zero Trust Workload Identity Manager
