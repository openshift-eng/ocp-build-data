base_image_release:
  force: true
for_release: false
content:
  source:
    dockerfile: konflux.Dockerfile
    git:
      branch:
        target: main
      url: git@github.com:openshift-priv/migtools-mta-java-analyzer-bundle.git
      web: https://github.com/migtools/mta-java-analyzer-bundle
jira:
  project: MTA
  component: JDTLS Server
distgit:
  component: mta-jdtls-server-base-container
delivery:
  delivery_repo_names:
  - mta/mta-jdtls-server-base-rhel9
enabled_repos:
- rhel-98-appstream-rpms
- rhel-98-baseos-rpms
from:
  builder:
    - member: base-rhel9
  member: base-rhel9
name: mta/mta-jdtls-server-base-rhel9
owners:
- mta-devs@redhat.com
dependents:
  - mta-operator
  - mta-java-external-provider
konflux:
  cachi2:
    artifact_lockfile:
      enabled: true
      resources:
        - url: https://download.eclipse.org/jdtls/milestones/1.60.0/jdt-language-server-1.60.0-202606262232.tar.gz
          filename: jdtls-product.tar.gz
        - type: maven
          filename: java-analyzer-bundle.core.jar
          attributes:
            repository_url: https://indy.corp.redhat.com/api/content/maven/hosted/pnc-builds
            group_id: io.konveyor.tackle
            artifact_id: java-analyzer-bundle.core
            version: 8.1.0.CR1-redhat-00003
            type: jar
        - type: maven
          filename: fernflower.jar
          attributes:
            repository_url: https://indy.corp.redhat.com/api/content/maven/hosted/pnc-builds
            group_id: org.jetbrains.java.decompiler
            artifact_id: fernflower
            version: 8.1.0.GA-redhat-00001
            type: jar
        - url: https://github.com/konveyor/maven-search-index/releases/download/v2025-11-11/maven-index-data-v20251112021242.zip
          filename: maven-index-data.zip
