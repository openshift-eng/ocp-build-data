content:
  source:
    dockerfile: konflux.Dockerfile
    git:
      branch:
        target: main
      url: git@github.com:openshift-priv/migtools-mta-java-analyzer-bundle.git
      web: https://github.com/migtools/mta-java-analyzer-bundle
jira:
  project: MTA
  component: JDTLS Server
distgit:
  component: mta-jdtls-server-base-container
delivery:
  delivery_repo_names:
  - mta/mta-jdtls-server-base-rhel10
for_payload: false
enabled_repos:
- rhel-10-appstream-rpms
- rhel-10-baseos-rpms
from:
  builder:
    - stream: rhel10
  stream: rhel10
name: mta/mta-jdtls-server-base-rhel10
owners:
- mta-devs@redhat.com
dependents:
  - mta-operator
  - mta-java-external-provider
konflux:
  cachi2:
    lockfile:
      # These deps are not being picked by dep solver
      rpms:
      - javapackages-tools
      - aopalliance
      - unzip
      modules:
      - maven:3.9
    artifact_lockfile:
      enabled: true
      resources:
        - url: https://download.eclipse.org/jdtls/milestones/1.51.0/jdt-language-server-1.51.0-202510022025.tar.gz
          filename: jdtls-product.tar.gz
        - url: https://indy.corp.redhat.com/api/content/maven/hosted/pnc-builds/io/konveyor/tackle/java-analyzer-bundle.core/8.1.0.CR1-redhat-00004/java-analyzer-bundle.core-8.1.0.CR1-redhat-00004.jar
          filename: java-analyzer-bundle.core.jar
        - url: https://indy.corp.redhat.com/api/content/maven/hosted/pnc-builds/org/jetbrains/java/decompiler/fernflower/8.1.0.GA-redhat-00001/fernflower-8.1.0.GA-redhat-00001.jar
          filename: fernflower.jar
        - url: https://github.com/konveyor/maven-search-index/releases/download/v2025-11-11/maven-index-data-v20251112021242.zip
          filename: maven-index-data.zip
