cachito:
  enabled: true
  packages:
    npm:
    - path: web
    gomod:
    - path: .
content:
  source:
    dockerfile: Dockerfile.art
    git:
      branch:
        target: release-{MAJOR}.{MINOR}
      url: git@github.com:openshift-priv/monitoring-plugin.git
      web: https://github.com/openshift/monitoring-plugin
    ci_alignment:
      streams_prs:
        ci_build_root:
          member: ci-openshift-build-root-latest.rhel9
    pkg_managers:
    - npm
    - gomod
    okd_alignment:
      dockerfile: Dockerfile
distgit:
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
  component: monitoring-plugin-container
delivery:
  delivery_repo_names:
  - openshift4/ose-monitoring-plugin-rhel9
for_payload: true
from:
  builder:
  - member: openshift-base-nodejs.rhel9
  - stream: rhel-9-golang
  member: openshift-enterprise-base-rhel9
name: openshift/ose-monitoring-plugin-rhel9
payload_name: monitoring-plugin
owners:
- team-observability-ui@redhat.com
konflux:
  cachito:
    mode: emulation
okd:
  content:
    source:
      dockerfile: Dockerfile
      modifications:
      - action: replace
        match: "RUN make install-frontend-ci"
        replacement: |
          RUN npm config set fetch-retries 5 && npm config set fetch-retry-mintimeout 30000 && npm config set fetch-retry-maxtimeout 120000
          RUN make install-frontend-ci || (echo 'Retrying npm install after 10s...' && sleep 10 && make install-frontend-ci) || (echo 'Retrying npm install (attempt 3) after 15s...' && sleep 15 && make install-frontend-ci)
