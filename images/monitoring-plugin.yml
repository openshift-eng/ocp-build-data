cachito:
  enabled: true
  packages:
    npm:
    - path: web
    gomod:
    - path: .
content:
  source:
    dockerfile: Dockerfile.art
    git:
      branch:
        target: release-{MAJOR}.{MINOR}
      url: git@github.com:openshift-priv/monitoring-plugin.git
      web: https://github.com/openshift/monitoring-plugin
    ci_alignment:
      streams_prs:
        ci_build_root:
          member: ci-openshift-build-root-latest.rhel9
    pkg_managers:
    - npm
    - gomod
distgit:
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
  component: monitoring-plugin-container
delivery:
  # Maps to honeybadger repo_name
  repo_name: ose-monitoring-plugin
  delivery_repo_names:
  - openshift4/ose-monitoring-plugin-rhel9
for_payload: true
from:
  builder:
  - member: openshift-base-nodejs.rhel9
  - stream: rhel-9-golang
  member: openshift-enterprise-base-rhel9
name: openshift/ose-monitoring-plugin-rhel9
payload_name: monitoring-plugin
owners:
- team-observability-ui@redhat.com
konflux:
  cachito:
    mode: emulation
  vm_override:
    aarch64: linux-d160-m2xlarge/arm64
okd:
  content:
    source:
      dockerfile: Dockerfile
      modifications:
      - action: replace
        match: "RUN make install-frontend-ci"
        replacement: |-
          RUN make install-frontend-ci && \
              if [ "$(uname -m)" = "aarch64" ]; then \
                cd web && \
                npm pack @esbuild/linux-arm64@0.27.2 && \
                mkdir -p node_modules/esbuild-loader/node_modules/@esbuild/linux-arm64 && \
                tar xzf esbuild-linux-arm64-*.tgz -C node_modules/esbuild-loader/node_modules/@esbuild/linux-arm64 --strip-components=1 && \
                rm -f esbuild-linux-arm64-*.tgz; \
              fi
