content:
  source:
    dockerfile: addons/redhat/Dockerfile.ocp
    git:
      branch:
        target: release-{MAJOR}.{MINOR}
      url: git@github.com:redhat-cne/downstream-ptp-operator-monorepo.git
      web: https://github.com/redhat-cne/downstream-ptp-operator-monorepo
    path: pkg/linuxptp-daemon
dependents:
- ptp-operator-mono
distgit:
  component: ose-linuxptp-daemon-mono-container
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
delivery:
  # Maps to honeybadger repo_name
  repo_name: ose-ptp-mono
  delivery_repo_names:
  - openshift4/ose-ptp-rhel9-mono
enabled_repos:
- rhel-9-baseos-rpms
- rhel-9-appstream-rpms
- rhel-9-server-ose-rpms-embargoed
for_payload: false
from:
  builder:
  - stream: rhel-9-golang
  member: openshift-enterprise-base-rhel9
name: openshift/ose-ptp-rhel9-mono
name_in_bundle: ptp-mono
owners:
- multus-dev@redhat.com
