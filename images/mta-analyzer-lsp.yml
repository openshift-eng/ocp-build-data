cachito:
  packages:
    gomod:
      - path: .
content:
  source:
    dockerfile: konflux.analyzer-lsp.Dockerfile
    git:
      branch:
        target: main
      url: git@github.com:openshift-priv/migtools-mta-analyzer-lsp.git
      web: https://github.com/migtools/mta-analyzer-lsp
jira:
  project: MTA
  component: Analyzer LSP
distgit:
  component: mta-analyzer-lsp-container
delivery:
  delivery_repo_names:
  - mta/mta-analyzer-lsp-rhel10
for_payload: false
enabled_repos:
- rhel-10-appstream-rpms
- rhel-10-baseos-rpms
from:
  builder:
    - stream: rhel-10-golang
  stream: rhel10
name: mta/mta-analyzer-lsp-rhel10
owners:
- mta-devs@redhat.com
dependents:
  - mta-operator
  - mta-analyzer-addon
  - mta-cli
