cachito:
  enabled: true
  packages:
    npm:
    - path: .
    - path: backend
    - path: frontend
content:
  source:
    dockerfile: Containerfile.mce
    git:
      branch:
        target: backplane-5.0
      url: git@github.com:openshift-priv/stolostron-console.git
      web: https://github.com/stolostron/console
distgit:
  component: mce-console-mce-container
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
delivery:
  delivery_repo_names:
  - multicluster-engine/console-mce-rhel9
dependents:
- backplane-operator
from:
  builder:
    - stream: rhel9-ubi
    - stream: rhel-9-nodejs-24
  stream: rhel-9-nodejs-24
name: multicluster-engine/console-mce-rhel9
owners:
- acm-cicd@redhat.com
