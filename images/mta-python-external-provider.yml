cachito:
  packages:
    gomod:
      - path: .
      - path: external-providers/python-external-provider/
    pip:
      - path: hack/cachi2
        requirements_files:
        - requirements.txt
        requirements_build_files:
        - requirements-build.txt
content:
  source:
    dockerfile: konflux.python-external-provider.Dockerfile
    git:
      branch:
        target: main
      url: git@github.com:openshift-priv/migtools-mta-analyzer-lsp.git
      web: https://github.com/migtools/mta-analyzer-lsp
    pkg_managers:
    - gomod
    - pip
jira:
  project: MTA
  component: Application Analysis
distgit:
  component: mta-python-external-provider-container
delivery:
  delivery_repo_names:
  - mta/mta-python-external-provider-rhel9
for_payload: false
enabled_repos:
- rhel-98-appstream-rpms
- rhel-98-baseos-rpms
from:
  builder:
    - stream: rhel-9-golang
  stream: rhel9
name: mta/mta-python-external-provider-rhel9
owners:
- mta-devs@redhat.com
dependents:
  - mta-cli
  - mta-operator
