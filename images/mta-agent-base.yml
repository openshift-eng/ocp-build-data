base_image_release:
  force: true
cachito:
  packages:
    gomod:
      - path: harness/
      - path: api/
    pip:
      - path: "."
        requirements_files:
        - requirements.txt
        binary:
          packages: ":all:"
          arch: "x86_64,aarch64"
          py_version: 311
    cargo:
      - path: images/agent-base/goose/
content:
  source:
    dockerfile: images/agent-base/Containerfile
    git:
      branch:
        target: main
      url: git@github.com:openshift-priv/migtools-mta-agentic-controller.git
      web: https://github.com/migtools/mta-agentic-controller
    modifications:
      - action: replace
        match: "RUN go mod download"
        replacement: "# go mod download removed - deps pre-fetched by cachi2"
      - action: replace
        match: |-
          RUN curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y \
              && apt-get update && apt-get install -y \
                  build-essential \
                  git \
                  cmake \
                  pkg-config \
                  libssl-dev \
                  libclang-dev \
                  clang \
                  libdbus-1-dev \
                  libxcb1-dev \
                  perl \
              && rm -rf /var/lib/apt/lists/*
        replacement: |-
          RUN dnf install -y \
              gcc gcc-c++ git cmake pkgconfig openssl-devel clang clang-devel dbus-devel libxcb-devel perl \
              rust cargo \
              && dnf clean all
      - action: replace
        match: 'ENV PATH="/root/.cargo/bin:${PATH}"'
        replacement: "# cargo from rpm is already on PATH"
      - action: replace
        match: |-
          RUN git clone https://github.com/aaif-goose/goose.git . \
              && git checkout ${GOOSE_VERSION} \
        replacement: |-
          RUN tar -xzf /cachi2/output/deps/generic/goose-v1.45.0.tar.gz --strip-components=1 \
      - action: replace
        match: '&& cargo build --release -p goose-cli --bin goose \'
        replacement: '&& rm -f .cargo/config.toml && cargo build --release -p goose-cli --bin goose \'
    pkg_managers:
    - gomod
    - pip
    - cargo
jira:
  project: MTA
  component: Analysis
distgit:
  component: mta-agent-base-container
delivery:
  delivery_repo_names:
  - mta/mta-agent-base-rhel9
enabled_repos:
- rhel-98-appstream-rpms
- rhel-98-baseos-rpms
- rhel-98-codeready-builder-rpms
from:
  builder:
    - stream: rhel-9-golang
  member: base-rhel9
name: mta/mta-agent-base-rhel9
owners:
- mta-devs@redhat.com
dependents:
  - mta-agent-java
  - mta-operator
konflux:
  cachi2:
    lockfile:
      rpms:
        - cargo
        - clang
        - clang-devel
        - cmake
        - dbus-devel
        - gcc
        - gcc-c++
        - git
        - libxcb-devel
        - openssl-devel
        - perl
        - rust
    artifact_lockfile:
      enabled: true
      resources:
        - url: https://github.com/aaif-goose/goose/archive/refs/tags/v1.45.0.tar.gz
          filename: goose-v1.45.0.tar.gz
