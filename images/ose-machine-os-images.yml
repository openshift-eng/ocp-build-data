content:
  source:
    git:
      branch:
        target: release-{MAJOR}.{MINOR}
      url: git@github.com:openshift-priv/machine-os-images.git
      web: https://github.com/openshift/machine-os-images
distgit:
  branch: rhaos-{MAJOR}.{MINOR}-rhel-8
  component: ose-machine-os-images-container
enabled_repos:
- rhel-8-baseos-rpms
- rhel-8-appstream-rpms
- rhel-8-server-ose-rpms-embargoed
delivery:
  # Maps to honeybadger repo_name
  repo_name: ose-machine-os-images
  delivery_repo_names:
  - openshift4/ose-machine-os-images-rhel8
for_payload: true
from:
  builder:
  - member: ose-installer
  member: openshift-enterprise-base
name: openshift/ose-machine-os-images-rhel8
payload_name: machine-os-images
owners:
- metal-platform@redhat.com
konflux:
  vm_override:
    # ref thread: https://redhat-internal.slack.com/archives/C04PZ7H0VA8/p1743022042311039
    # can be removed after whilelist is in
    x86_64: linux/amd64
  cachi2:
    artifact_lockfile:
      # RHCOS ISO URLs sourced from openshift/installer repo:
      # data/data/coreos/rhcos.json
      # These are the same URLs that openshift-install coreos print-stream-json outputs.
      # Whenever it changes, update these URLs to match .architectures.{arch}.artifacts.metal.formats.iso.disk.location
      resources:
      - url: https://rhcos.mirror.openshift.com/art/storage/prod/streams/4.15-9.2/builds/415.92.202407091355-0/x86_64/rhcos-415.92.202407091355-0-live.x86_64.iso
        filename: coreos-x86_64.iso
      - url: https://rhcos.mirror.openshift.com/art/storage/prod/streams/4.15-9.2/builds/415.92.202407091355-0/aarch64/rhcos-415.92.202407091355-0-live.aarch64.iso
        filename: coreos-aarch64.iso
      - url: https://rhcos.mirror.openshift.com/art/storage/prod/streams/4.15-9.2/builds/415.92.202407091355-0/ppc64le/rhcos-415.92.202407091355-0-live.ppc64le.iso
        filename: coreos-ppc64le.iso
      - url: https://rhcos.mirror.openshift.com/art/storage/prod/streams/4.15-9.2/builds/415.92.202407091355-0/s390x/rhcos-415.92.202407091355-0-live.s390x.iso
        filename: coreos-s390x.iso
