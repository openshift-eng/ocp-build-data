cachito:
  packages:
    gomod:
      - path: .
content:
  source:
    dockerfile: Containerfile.art
    git:
      allow_unprotected_branch: true
      branch:
        target: cert-manager-1.19
      url_pull: https://github.com/shruti-rh/cert-manager-operator.git
      url: git@github.com:openshift-priv/cert-manager-operator.git
      web: https://github.com/openshift/cert-manager-operator
distgit:
  component: cert-manager-operator-container
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
delivery:
  bundle_delivery_repo_name: cert-manager/cert-manager-operator-bundle
  delivery_repo_names:
    - cert-manager/cert-manager-operator-rhel9
for_payload: false
enabled_repos:
  - rhel-9-appstream-rpms
  - rhel-9-baseos-rpms
from:
  builder:
    - stream: rhel-9-golang
  member: base-rhel9
name: cert-manager/cert-manager-operator-rhel9
owners:
  - tgeer@redhat.com
  - mykastur@redhat.com
  - bhb@redhat.com
  - sbhor@redhat.com
update-csv:
  bundle-dir: manifests/
  manifests-dir: bundle/
  registry: image-registry.openshift-image-registry.svc:5000
  valid-subscription-label: '["OpenShift Kubernetes Engine", "OpenShift Container Platform", "OpenShift Platform Plus"]'
jira:
  project: CM
  component: cert-manager Operator
