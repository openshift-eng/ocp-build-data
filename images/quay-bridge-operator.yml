cachito:
  enabled: true
content:
  source:
    dockerfile: Containerfile.art
    git:
      branch:
        target: redhat-3.17
      url: git@github.com:openshift-priv/quay-quay-bridge-operator.git
      url_pull: https://github.com/shruti-rh/quay-bridge-operator.git
      web: https://github.com/quay/quay-bridge-operator
jira:
  project: PROJQUAY
  component: Bridge Operator
distgit:
  component: quay-bridge-operator-container
delivery:
  bundle_delivery_repo_name: quay/quay-bridge-operator-bundle
  delivery_repo_names:
  - quay/quay-bridge-operator-rhel9
for_payload: false
enabled_repos:
- rhel-9-appstream-rpms
- rhel-9-baseos-rpms
from:
  builder:
  - stream: rhel-9-golang
  stream: rhel9-minimal
name: quay/quay-bridge-operator-rhel9
owners:
- quay-devel@redhat.com
update-csv:
  bundle-dir: downstream/manifests/
  manifests-dir: bundle/
  registry: image-registry.openshift-image-registry.svc:5000
  valid-subscription-label: '["OpenShift Kubernetes Engine", "OpenShift Container Platform", "OpenShift Platform Plus"]'
