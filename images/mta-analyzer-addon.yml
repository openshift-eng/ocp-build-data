cachito:
  packages:
    gomod:
      - path: .
content:
  source:
    dockerfile: konflux.Dockerfile
    git:
      branch:
        target: main
      url: git@github.com:openshift-priv/migtools-mta-tackle2-addon-analyzer.git
      web: https://github.com/migtools/mta-tackle2-addon-analyzer
jira:
  project: MTA
  component: Application Analysis
distgit:
  component: mta-analyzer-addon-container
delivery:
  delivery_repo_names:
  - mta/mta-analyzer-addon-rhel10
for_payload: false
enabled_repos:
- rhel-10-appstream-rpms
- rhel-10-baseos-rpms
from:
  builder:
    - stream: rhel-10-golang
  member: mta-analyzer-lsp
name: mta/mta-analyzer-addon-rhel10
owners:
- mta-devs@redhat.com
dependents:
  - mta-operator
konflux:
  cachi2:
    lockfile:
      # These deps are not being picked by dep solver
      rpms:
      - glibc-devel
      - glibc-headers
