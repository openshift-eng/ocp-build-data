content:
  source:
    allow_mismatched_siblings: true  # SMB operator tracks release-4.18 while its sibling aws-efs tracks release-{MAJOR}.{MINOR}
    dockerfile: Dockerfile.samba
    git:
      branch:
        target: release-4.18
      url: git@github.com:openshift-priv/csi-operator.git
      web: https://github.com/openshift/csi-operator
    ci_alignment:
      streams_prs:
        enabled: false
distgit:
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
  component: ose-smb-csi-driver-operator-container
  bundle_component: ose-smb-csi-driver-operator-bundle-container
delivery:
  bundle_delivery_repo_name: openshift4/ose-smb-csi-driver-operator-bundle
  delivery_repo_names:
  - openshift4/ose-smb-csi-driver-rhel9-operator
for_payload: false
from:
  builder:
  - stream: rhel-9-golang
  member: openshift-enterprise-base-rhel9
name: openshift/ose-smb-csi-driver-rhel9-operator
name_in_bundle: smb-csi-driver-rhel9-operator
owners:
- aos-storage-staff@redhat.com
update-csv:
  bundle-dir: stable
  manifests-dir: config/samba/manifests/
  registry: image-registry.openshift-imageregistry.svc:5000
  valid-subscription-label: '["OpenShift Container Platform", "OpenShift Platform Plus"]'
