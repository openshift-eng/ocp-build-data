# Disable automated builds, this image is intended to be built manually like microshift rpm
mode: disabled
arches:
- x86_64
- aarch64
content:
  source:
    dockerfile: packaging/imagemode/Containerfile.repobase
    modifications:
    - action: replace
      match: "ARG BASE_IMAGE_URL"
      replacement: "ARG BASE_IMAGE_URL=registry.redhat.io/rhel9-eus/rhel-9.6-bootc"
    - action: replace
      match: "ARG BASE_IMAGE_TAG"
      replacement: "ARG BASE_IMAGE_TAG=9.6"
    - action: replace
      match: "RUN dnf install"
      replacement: |
        RUN rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release && \
            dnf install \
    git:
      branch:
        target: release-{MAJOR}.{MINOR}
      url: git@github.com:openshift-priv/microshift.git
      web: https://github.com/openshift/microshift
    ci_alignment:
      streams_prs:
        enabled: false
# Declare the base image via `from:` so doozer resolves it into downstream_parents
# and generates the RPM lockfile in image mode (rpmdb-aware). Without this, the base
# is only known via the Containerfile BASE_IMAGE_* ARGs, the lockfile resolves in
# bare mode, and conditional deps of the base kernel (e.g. microshift's
# `Requires: (kernel-modules-extra if kernel-core)`) are omitted from the prefetch,
# breaking the hermetic build. Must match BASE_IMAGE_URL/BASE_IMAGE_TAG above.
from:
  image: registry.redhat.io/rhel9-eus/rhel-9.6-bootc:9.6
delivery:
  delivery_repo_names:
  - openshift4/microshift-bootc-rhel9
# This image has its own separate release process, see USHIFT-4024
for_release: false
for_payload: false
enabled_repos:
- rhel-96-baseos
- rhel-96-appstream
- rhel-9-fast-datapath-rpms
- rhel-9-server-microshift-rpms
name: openshift/microshift-bootc-rhel9
owners:
- microshift-devel@redhat.com
konflux:
  cachi2:
    lockfile:
      backend: rpm-lockfile-prototype
