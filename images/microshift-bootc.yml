# Disable automated builds, this image is intended to be built manually like microshift rpm
mode: disabled
arches:
- x86_64
- aarch64
content:
  source:
    dockerfile: packaging/imagemode/Containerfile.repobase
    modifications:
    - action: replace
      match: "ARG BASE_IMAGE_URL"
      replacement: "ARG BASE_IMAGE_URL=registry.redhat.io/rhel9-eus/rhel-9.6-bootc"
    - action: replace
      match: "ARG BASE_IMAGE_TAG"
      replacement: "ARG BASE_IMAGE_TAG=9.6"
    - action: replace
      match: "ARG DNF_OPTIONS"
      replacement: |
        ARG DNF_OPTIONS
        RUN printf '%s\n' \
            '[rhel-9-baseos]' \
            'baseurl=https://rhsm-pulp.corp.redhat.com/content/e4s/rhel9/9.6/$basearch/baseos/os/' \
            'enabled=1' \
            'gpgcheck=0' \
            '' \
            '[rhel-9-appstream]' \
            'baseurl=https://rhsm-pulp.corp.redhat.com/content/e4s/rhel9/9.6/$basearch/appstream/os/' \
            'enabled=1' \
            'gpgcheck=0' \
            '' \
            '[rhel-9-fast-datapath]' \
            'baseurl=https://rhsm-pulp.corp.redhat.com/content/dist/layered/rhel9/$basearch/fast-datapath/os/' \
            'enabled=1' \
            'gpgcheck=0' \
            '' \
            '[rhocp-microshift]' \
            'baseurl=https://ocp-artifacts.engineering.redhat.com/pub/RHOCP/plashets/{MAJOR}.{MINOR}/{runtime_assembly}/microshift-el9/latest/$basearch/os/' \
            'enabled=1' \
            'gpgcheck=0' \
            'sslverify=0' \
            'module_hotfixes=1' \
            > /etc/yum.repos.d/art-repos.repo
    - action: replace
      match: "RUN dnf install"
      replacement: |
        RUN rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release && \
            dnf install \
    git:
      branch:
        target: release-{MAJOR}.{MINOR}
      url: git@github.com:openshift-priv/microshift.git
      web: https://github.com/openshift/microshift
    pkg_managers:
    - gomod
    ci_alignment:
      streams_prs:
        enabled: false
delivery:
  delivery_repo_names:
  - openshift4/microshift-bootc-rhel9
# This image has its own separate release process, see USHIFT-4024
for_release: false
for_payload: false
enabled_repos:
- rhel-9-baseos-rpms
- rhel-9-appstream-rpms
- rhel-9-fast-datapath-rpms
- rhel-9-server-microshift-rpms
konflux:
  network_mode: open
name: openshift/microshift-bootc-rhel9
owners:
- microshift-devel@redhat.com
