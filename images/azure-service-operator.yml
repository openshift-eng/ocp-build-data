cachito:
  enabled: true
  packages:
    gomod:
    - path: v2
content:
  source:
    pkg_managers:
    - gomod
    dockerfile: stolostron/Dockerfile.stolostron
    git:
      branch:
        target: backplane-5.1
      url: git@github.com:openshift-priv/stolostron-azure-service-operator.git
      web: https://github.com/stolostron/azure-service-operator
distgit:
  component: mce-azure-service-operator-container
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
delivery:
  delivery_repo_names:
  - multicluster-engine/azure-service-operator-rhel9
dependents:
- backplane-operator
enabled_repos:
- rhel-9-baseos-rpms
- rhel-9-appstream-rpms
from:
  builder:
    - stream: rhel-9-golang
  member: base-rhel9
name: multicluster-engine/azure-service-operator-rhel9
owners:
- acm-cicd@redhat.com
konflux:
  # Default arm64 is an 8Gi VM, and the default x86_64 build is an in-cluster
  # pod limited to 8Gi. linux-m2xlarge is 32Gi and is available on kflux-ocp-p01.
  vm_override:
    x86_64: linux-m2xlarge/amd64
    aarch64: linux-m2xlarge/arm64
