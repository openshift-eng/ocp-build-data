arches:
- aarch64
content:
  source:
    dockerfile: off-layering/nvidia/Containerfile
    git:
      branch:
        target: pr/nvidia_merge
      url: git@github.com:openshift-priv/os.git
      url_pull: git@github.com:adobes1/os.git
      web: https://github.com/adobes1/os
    ci_alignment:
      streams_prs:
        enabled: false
      mirror: false
    modifications:
    - action: replace
      match: "COPY off-layering/nvidia/voyager.repo  /etc/yum.repos.d/"
      replacement: ""
    - action: replace
      match: "dnf install --assumeyes --disablerepo=* --enablerepo=voyager $kernel_name"
      replacement: "dnf install --assumeyes $kernel_name"
    - action: replace
      match: "ARG KERNEL_VERSION=''"
      replacement: "ARG KERNEL_VERSION='6.12.0-259.26.el10nv'"
distgit:
  branch: rhaos-{MAJOR}.{MINOR}-rhel-10
  component: rhcos-node-image-nvidia-container
enabled_repos:
- rhel-10-server-ose-rpms
- rhel-102-baseos
- rhel-102-appstream
- rhel-102-fast-datapath
- rhel-10-nvidia
for_payload: false
for_release: false
from:
  member: rhcos-node-image-rhel10
labels:
  distribution-scope: public
  url: "https://access.redhat.com/errata"
name: openshift/rhcos-node-image-nvidia-rhel10
owners:
- aos-team-art@redhat.com
canonical_builders_from_upstream: false
konflux:
  image_repo: quay.io/redhat-user-workloads/ocp-art-tenant/art-rhcos-images
  skip_validate_slsa: true
okd:
  mode: disabled
