content:
  source:
    dockerfile: Dockerfile
    git:
      branch:
        target: release-{MAJOR}.{MINOR}
      url: git@github.com:openshift-priv/networking-console-plugin.git
      web: https://github.com/openshift/networking-console-plugin
    pkg_managers:
    - npm
distgit:
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
  component: networking-console-plugin-container
delivery:
  delivery_repo_names:
  - openshift5/ose-networking-console-plugin-rhel9
enabled_repos:
- rhel-9-baseos-rpms
- rhel-9-appstream-rpms
for_payload: true
from:
  builder:
  - member: openshift-base-nodejs.rhel9
  member: openshift-enterprise-base-rhel9
name: openshift5/ose-networking-console-plugin-rhel9
owners:
- phbailey@redhat.com
- rlavi@redhat.com
payload_name: networking-console-plugin
konflux:
  vm_override:
    aarch64: linux-d160-c4xlarge/arm64
okd:
  content:
    source:
      modifications:
      - action: replace
        match: "RUN npm clean-install --ignore-scripts --no-audit && npm run build"
        replacement: |-
          RUN npm config set fetch-timeout 600000 && \
              npm config set fetch-retries 5 && \
              npm config set fetch-retry-mintimeout 30000 && \
              npm config set fetch-retry-maxtimeout 120000 && \
              for attempt in 1 2 3 4 5; do \
                echo "Attempt $attempt: npm clean-install"; \
                npm clean-install --ignore-scripts --no-audit && break; \
                echo "Attempt $attempt failed"; \
                [ "$attempt" -lt 5 ] && sleep 60; \
              done && \
              npm run build
