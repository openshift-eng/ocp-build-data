cachito:
  packages:
    gomod:
      - path: .
content:
  source:
    dockerfile: Dockerfile.art
    git:
      branch:
        target: release-coo-1.5
      url: git@github.com:openshift-priv/prometheus.git
      web: https://github.com/openshift/prometheus
distgit:
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
  component: prometheus-rhel9-container
delivery:
  delivery_repo_names:
  - cluster-observability-operator/prometheus-rhel9
from:
  builder:
  - stream: rhel-9-golang
  member: base-rhel9
konflux:
  cachi2:
    artifact_lockfile:
      enabled: true
      path: .
      resources:
      - url: https://github.com/prometheus/prometheus/releases/download/v3.14.0/prometheus-web-ui-3.14.0.tar.gz
        filename: prometheus-web-ui.tar.gz
name: cluster-observability-operator/prometheus-rhel9
owners:
- team-monitoring@redhat.com
