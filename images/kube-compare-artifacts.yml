content:
  source:
    dockerfile: Dockerfile
    git:
      branch:
        target: release-{MAJOR}.{MINOR}
      url: git@github.com:openshift-priv/kube-compare.git
      web: https://github.com/openshift/kube-compare
    ci_alignment:
      streams_prs:
        # openshift-4.19 has no active build/transform/publish path for a Go 1.25 CI root.
        enabled: false
distgit:
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
  component: kube-compare-artifacts-container
delivery:
  delivery_repo_names:
  - openshift4/kube-compare-artifacts-rhel9
for_payload: false
from:
  builder:
  - stream: rhel-8-golang-1.25
  - stream: rhel-9-golang-1.25
  member: openshift-enterprise-cli
name: openshift4/kube-compare-artifacts-rhel9
payload_name: kube-compare-artifacts
owners:
- jramsay@redhat.com
- imiller@redhat.com
