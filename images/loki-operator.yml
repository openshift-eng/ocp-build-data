content:
  source:
    dockerfile: Dockerfile.micro
    git:
      branch:
        target: main
      url: git@github.com:openshift-priv/loki-operator.git
      web: https://github.com/openshift/loki-operator
distgit:
  component: loki-rhel9-operator-container
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
delivery:
  bundle_delivery_repo_name: openshift-logging/loki-operator-bundle
  delivery_repo_names:
  - openshift-logging/loki-rhel9-operator
enabled_repos:
- rhel-9-baseos-rpms
- rhel-9-appstream-rpms
from:
  builder:
    - stream: rhel-9-golang
  stream: rhel9-micro
name: openshift-logging/loki-rhel9-operator
owners:
- rojacob@redhat.com
update-csv:
  bundle-dir: openshift/manifests/
  manifests-dir: bundle/
  registry: image-registry.openshift-image-registry.svc:5000
  valid-subscription-label: '["OpenShift Kubernetes Engine", "OpenShift Container Platform", "OpenShift Platform Plus"]'
jira:
  project: LOG
  component: loki-rhel9-operator-container
