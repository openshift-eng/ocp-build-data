cachito:
  enabled: true
  packages:
    gomod:
    - path: .
content:
  source:
    pkg_managers:
    - gomod
    dockerfile: Containerfile.operator
    git:
      branch:
        target: release-2.16
      url: git@github.com:openshift-priv/stolostron-grafana.git
      url_pull: https://github.com/dhaiducek/grafana.git
      web: https://github.com/stolostron/grafana
distgit:
  component: acm-grafana-container
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
delivery:
  delivery_repo_names:
  - rhacm2/grafana-rhel9
for_payload: false
from:
  builder:
    - stream: rhel-9-golang
  stream: rhel9
name: rhacm2/grafana-rhel9
owners:
- acm-cicd@redhat.com
jira:
  project: ACM
  component: acm-grafana-container
