cachito:
  packages:
    gomod:
      - path: .
content:
  source:
    dockerfile: Dockerfile.art
    git:
      branch:
        target: release-coo-1.5
      url: git@github.com:openshift-priv/prometheus-alertmanager.git
      web: https://github.com/openshift/prometheus-alertmanager
distgit:
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
  component: alertmanager-rhel9-container
delivery:
  delivery_repo_names:
  - cluster-observability-operator/alertmanager-rhel9
from:
  builder:
  - stream: rhel-9-golang
  member: base-rhel9
konflux:
  cachi2:
    artifact_lockfile:
      enabled: true
      path: .
      resources:
      - url: https://github.com/prometheus/alertmanager/releases/download/v0.33.1/alertmanager-web-ui-0.33.1.tar.gz
        filename: alertmanager-web-ui.tar.gz
name: cluster-observability-operator/alertmanager-rhel9
owners:
- team-monitoring@redhat.com
