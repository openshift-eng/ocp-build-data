arches:
- x86_64
- aarch64
content:
  source:
    dockerfile: Dockerfile.openshift
    git:
      branch:
        target: release-{MAJOR}.{MINOR}
      url: git@github.com:openshift-priv/azure-file-csi-driver.git
      web: https://github.com/openshift/azure-file-csi-driver
    ci_alignment:
      streams_prs:
        # openshift-4.15 has no active build/transform/publish path for a Go 1.21 CI root.
        enabled: false
        commit_prefix: "UPSTREAM: <carry>: "
        auto_label:
        - approved
        - lgtm
distgit:
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
  component: ose-azure-file-csi-driver-container
enabled_repos:
- rhel-9-baseos-rpms
- rhel-9-appstream-rpms
delivery:
  delivery_repo_names:
  - openshift4/ose-azure-file-csi-driver-rhel9
for_payload: true
from:
  builder:
  - stream: rhel-9-golang-1.21
  member: openshift-enterprise-base-rhel9
name: openshift4/ose-azure-file-csi-driver-rhel9
payload_name: azure-file-csi-driver
owners:
- aos-storage-staff@redhat.com
