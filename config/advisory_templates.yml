  multicluster-engine:
    rhsa:
      synopsis: Red Hat multicluster engine for Kubernetes - {PRODUCT_MAJOR}.{PRODUCT_MINOR}.{PRODUCT_PATCH}
      topic: |
        Red Hat multicluster engine for Kubernetes v{PRODUCT_MAJOR}.{PRODUCT_MINOR}.{PRODUCT_PATCH} general availability release images, which provide security fixes, bug fixes, and updated container images.
      description: |
        The multicluster engine for Kubernetes provides the foundational components that are necessary for the centralized management of multiple Kubernetes-based clusters across data centers, public clouds, and private clouds.

        You can use the engine to create new Red Hat OpenShift Container Platform clusters or to bring existing Kubernetes-based clusters under management by importing them. After the clusters are managed, you can use the APIs that are provided by the engine to distribute configuration based on placement policy.
      solution: |
        For multicluster engine for Kubernetes, see the following documentation for details on how to install the images:

        https://access.redhat.com/documentation/en-us/red_hat_advanced_cluster_management_for_kubernetes/latest/html/clusters/cluster_mce_overview#mce-install-intro
