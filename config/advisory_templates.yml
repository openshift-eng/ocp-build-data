  rhacm2:
    rhsa:
      synopsis: Red Hat Advanced Cluster Management for Kubernetes - {PRODUCT_MAJOR}.{PRODUCT_MINOR}.{PRODUCT_PATCH}
      topic: |
        Red Hat Advanced Cluster Management for Kubernetes v{PRODUCT_MAJOR}.{PRODUCT_MINOR}.{PRODUCT_PATCH} general availability release images, which provide security fixes, bug fixes, and updated container images.
      description: |
        Red Hat Advanced Cluster Management for Kubernetes provides the capabilities to address common challenges that administrators and site reliability engineers face as they work across a range of public and private cloud environments. Clusters and applications are all visible and managed from a single console, with security policy built in.

        This advisory contains the container images for Red Hat Advanced Cluster Management for Kubernetes, which add new features and enhancements, bug fixes, and updated container images. See the following Release Notes documentation, which will be updated shortly for this release, for additional details about this release:

        https://docs.redhat.com/en/documentation/red_hat_advanced_cluster_management_for_kubernetes/{PRODUCT_MAJOR}.{PRODUCT_MINOR}/html-single/release_notes/index#acm-release-notes
      solution: |
        Before you apply this update, make sure all previously released errata that are relevant to your system are applied.

        For details on how to apply this update, refer to:

        https://access.redhat.com/articles/11258
