# ART-22737: the openshift-install client tarballs, shipped through the Konflux push-artifacts-to-cdn
# pipeline. Built as a container image that carries them under /releases/ (build context:
# binaries/openshift-install/), only by the binaries-cdn-release job after promote, with the release
# values as build args. Image commands and mass rebuilds never load binaries/.
arches:
- x86_64
canonical_builders_from_upstream: false
content:
  source:
    dockerfile: Dockerfile
    path: binaries/openshift-install
    git:
      branch:
        target: openshift-{MAJOR}.{MINOR}
      url: git@github.com:openshift-priv/ocp-build-data.git
      web: https://github.com/openshift-eng/ocp-build-data
from:
  builder:
  - member: ose-installer
  - member: ose-installer
  - member: ose-installer
  - member: ose-installer
  - member: ose-installer-artifacts
  - member: ose-installer-artifacts
  - member: ose-installer-artifacts
  - member: ose-installer-artifacts
  - member: ose-baremetal-installer
  - member: ose-baremetal-installer
  - member: ose-baremetal-installer
  - member: ose-baremetal-installer
  stream: rhel9
konflux:
  allow_cross_platform_images: true
  cachi2:
    enabled: false
  network_mode: hermetic
  no_shell: true
  vm_override:
    x86_64: linux-d320-m8xlarge/amd64
name: openshift/openshift-install-binaries-rhel9
owners:
- aos-team-art@redhat.com
