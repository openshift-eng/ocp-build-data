freeze_automation: false

name: oc-mirror-2.0
product: oc-mirror
version: "2.0"

vars:
  MAJOR: 2
  MINOR: 0

arches:
- x86_64
- aarch64
- ppc64le
- s390x

konflux:
  arches:
  - x86_64
  - aarch64
  - ppc64le
  - s390x
  network_mode: hermetic
  image_repo: quay.io/redhat-user-workloads/ocp-art-tenant/oc-mirror-2-0
  cachi2:
    enabled: true
    gomod_version_patch: true
  sast:
    enabled: true
  build_attempts: 1

assemblies:
  enabled: true

public_upstreams:
- private: "https://github.com/openshift-priv"
  public: "https://github.com/openshift"

urls:
  brewhub: https://brewhub.engineering.redhat.com/brewhub
  brew_image_host: registry-proxy.engineering.redhat.com
  brew_image_namespace: rh-osbs
