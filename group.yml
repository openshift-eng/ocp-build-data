freeze_automation: true

name: supplemental-tools
product: supplemental-tools

arches:
- x86_64
- ppc64le
- s390x
- aarch64

konflux:
  arches:
  - x86_64
  - aarch64
  - s390x
  - ppc64le
  cachi2:
    enabled: true
    gomod_version_patch: true
    lockfile:
      force: true
  network_mode: hermetic

assemblies:
  enabled: true

public_upstreams:
- private: "https://github.com/openshift-priv/block-copyfail"
  public:  "https://github.com/openshift/block-copyfail"

urls:
  brewhub: https://brewhub.engineering.redhat.com/brewhub
  brew_image_host: registry-proxy.engineering.redhat.com
  brew_image_namespace: rh-osbs
