name: logging-6.3
product: installer-ove-ui

vars:
  MAJOR: 4
  MINOR: 20


arches:
- x86_64


konflux:
  arches:
  - x86_64
  network_mode: hermetic

assemblies:
  enabled: true

public_upstreams:
- private: "https://github.com/openshift-priv"
