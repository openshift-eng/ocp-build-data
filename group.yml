freeze_automation: false
name: mce-2.6
csv_namespace: multicluster-engine
product: multicluster-engine
version: 2.6.17

vars:
  GO_LATEST: "1.26"
  GO_EXTRA: "1.26"
  MAJOR: 4
  MINOR: 16

# Hub support range is 4.12–4.17 (HYPBLD-880 A1). 4.12 is a required support exception.
# Alignment (MAJOR/MINOR, distgit, ose-cli) is OCP 4.16.
OCP_TARGET_VERSIONS: [
  "4.12",
  "4.13",
  "4.14",
  "4.15",
  "4.16",
  "4.17",
]

OCP_RELEASE_NOTES_VERSION: "4.16"

arches:
- x86_64
- ppc64le
- s390x
- aarch64

operator_image_ref_mode: manifest-list

mr_approvers:
  QE:
    - ashwindasr
  DOCS:
    - ashwindasr

konflux:
  # The number of times a build should be attempted before giving up.
  build_attempts: 1
  arches:
  - x86_64
  - aarch64
  - s390x
  - ppc64le
  cachi2:
    enabled: true
    lockfile:
      backend: rpm-lockfile-prototype
  network_mode: hermetic

assemblies:
  enabled: true

public_upstreams:
- private: "https://github.com/openshift-priv"
  public:  "https://github.com/stolostron"
- private: "https://github.com/openshift-priv/cluster-api-provider-openshift-assisted"
  public:  "https://github.com/openshift-assisted/cluster-api-provider-openshift-assisted"
- private: "https://github.com/openshift-priv/hypershift"
  public:  "https://github.com/openshift/hypershift"
- private: "https://github.com/openshift-priv/hive"
  public:  "https://github.com/openshift/hive"
- private: "https://github.com/openshift-priv/cluster-api-provider-kubevirt"
  public:  "https://github.com/openshift/cluster-api-provider-kubevirt"
- private: "https://github.com/openshift-priv/image-based-install-operator"
  public:  "https://github.com/openshift/image-based-install-operator"
- private: "https://github.com/openshift-priv/cluster-api-provider-agent"
  public:  "https://github.com/openshift/cluster-api-provider-agent"
- private: "https://github.com/openshift-priv/assisted-service"
  public:  "https://github.com/openshift/assisted-service"
- private: "https://github.com/openshift-priv/assisted-image-service"
  public:  "https://github.com/openshift/assisted-image-service"
- private: "https://github.com/openshift-priv/assisted-installer"
  public:  "https://github.com/openshift/assisted-installer"
- private: "https://github.com/openshift-priv/assisted-installer-agent"
  public:  "https://github.com/openshift/assisted-installer-agent"
- private: "https://github.com/openshift-priv/ocp-build-data"
  public: "https://github.com/openshift-eng/ocp-build-data"

urls:
  brewhub: https://brewhub.engineering.redhat.com/brewhub
  brew_image_host: registry-proxy.engineering.redhat.com
  brew_image_namespace: rh-osbs

repos:
  rhel-9-baseos-rpms:
    conf:
      baseurl:
        aarch64: https://rhsm-pulp.corp.redhat.com/content/dist/rhel9/9.7/aarch64/baseos/os/
        ppc64le: https://rhsm-pulp.corp.redhat.com/content/dist/rhel9/9.7/ppc64le/baseos/os/
        s390x: https://rhsm-pulp.corp.redhat.com/content/dist/rhel9/9.7/s390x/baseos/os/
        x86_64: https://rhsm-pulp.corp.redhat.com/content/dist/rhel9/9.7/x86_64/baseos/os/
    content_set:
      default: rhel-9-for-x86_64-baseos-rpms
      aarch64: rhel-9-for-aarch64-baseos-rpms
      ppc64le: rhel-9-for-ppc64le-baseos-rpms
      s390x: rhel-9-for-s390x-baseos-rpms
    reposync:
      enabled: false

  rhel-9-appstream-rpms:
    conf:
      baseurl:
        aarch64: https://rhsm-pulp.corp.redhat.com/content/dist/rhel9/9.7/aarch64/appstream/os/
        ppc64le: https://rhsm-pulp.corp.redhat.com/content/dist/rhel9/9.7/ppc64le/appstream/os/
        s390x: https://rhsm-pulp.corp.redhat.com/content/dist/rhel9/9.7/s390x/appstream/os/
        x86_64: https://rhsm-pulp.corp.redhat.com/content/dist/rhel9/9.7/x86_64/appstream/os/
    content_set:
      default: rhel-9-for-x86_64-appstream-rpms
      aarch64: rhel-9-for-aarch64-appstream-rpms
      ppc64le: rhel-9-for-ppc64le-appstream-rpms
      s390x: rhel-9-for-s390x-appstream-rpms
    reposync:
      enabled: false

  rhel-9-codeready-builder-rpms:
    conf:
      baseurl:
        aarch64: https://rhsm-pulp.corp.redhat.com/content/dist/rhel9/9.7/aarch64/codeready-builder/os/
        ppc64le: https://rhsm-pulp.corp.redhat.com/content/dist/rhel9/9.7/ppc64le/codeready-builder/os/
        s390x: https://rhsm-pulp.corp.redhat.com/content/dist/rhel9/9.7/s390x/codeready-builder/os/
        x86_64: https://rhsm-pulp.corp.redhat.com/content/dist/rhel9/9.7/x86_64/codeready-builder/os/
    content_set:
      default: codeready-builder-for-rhel-9-x86_64-rpms
      aarch64: codeready-builder-for-rhel-9-aarch64-rpms
      ppc64le: codeready-builder-for-rhel-9-ppc64le-rpms
      s390x: codeready-builder-for-rhel-9-s390x-rpms
    reposync:
      enabled: false

  rhocp-4.17-rhel9-rpms:
    conf:
      extra_options:
        # Required to enable RPMs with higher NVRs to show up as installable options in the presence of modules from another repo.
        # i.e. modules mask traditional rpms unless this flag is provided.
        module_hotfixes: 1
      baseurl:
        aarch64: https://rhsm-pulp.corp.redhat.com/content/dist/layered/rhel9/aarch64/rhocp/4.17/os/
        ppc64le: https://rhsm-pulp.corp.redhat.com/content/dist/layered/rhel9/ppc64le/rhocp/4.17/os/
        s390x: https://rhsm-pulp.corp.redhat.com/content/dist/layered/rhel9/s390x/rhocp/4.17/os/
        x86_64: https://rhsm-pulp.corp.redhat.com/content/dist/layered/rhel9/x86_64/rhocp/4.17/os/
    content_set:
      default: rhocp-4.17-for-rhel-9-x86_64-rpms
      aarch64: rhocp-4.17-for-rhel-9-aarch64-rpms
      ppc64le: rhocp-4.17-for-rhel-9-ppc64le-rpms
      s390x: rhocp-4.17-for-rhel-9-s390x-rpms
    reposync:
      enabled: false

  rhel-8-baseos-rpms:
    conf:
      baseurl:
        aarch64: https://rhsm-pulp.corp.redhat.com/content/dist/rhel8/8/aarch64/baseos/os/
        ppc64le: https://rhsm-pulp.corp.redhat.com/content/dist/rhel8/8/ppc64le/baseos/os/
        s390x: https://rhsm-pulp.corp.redhat.com/content/dist/rhel8/8/s390x/baseos/os/
        x86_64: https://rhsm-pulp.corp.redhat.com/content/dist/rhel8/8/x86_64/baseos/os/
    content_set:
      default: rhel-8-for-x86_64-baseos-rpms
      aarch64: rhel-8-for-aarch64-baseos-rpms
      ppc64le: rhel-8-for-ppc64le-baseos-rpms
      s390x: rhel-8-for-s390x-baseos-rpms
    reposync:
      enabled: false

  rhel-8-appstream-rpms:
    conf:
      baseurl:
        aarch64: https://rhsm-pulp.corp.redhat.com/content/dist/rhel8/8/aarch64/appstream/os/
        ppc64le: https://rhsm-pulp.corp.redhat.com/content/dist/rhel8/8/ppc64le/appstream/os/
        s390x: https://rhsm-pulp.corp.redhat.com/content/dist/rhel8/8/s390x/appstream/os/
        x86_64: https://rhsm-pulp.corp.redhat.com/content/dist/rhel8/8/x86_64/appstream/os/
    content_set:
      default: rhel-8-for-x86_64-appstream-rpms
      aarch64: rhel-8-for-aarch64-appstream-rpms
      ppc64le: rhel-8-for-ppc64le-appstream-rpms
      s390x: rhel-8-for-s390x-appstream-rpms
    reposync:
      enabled: false

  rhocp-4.16-rhel8-rpms:
    conf:
      extra_options:
        # Required to enable RPMs with higher NVRs to show up as installable options in the presence of modules from another repo.
        # i.e. modules mask traditional rpms unless this flag is provided.
        module_hotfixes: 1
      baseurl:
        aarch64: https://rhsm-pulp.corp.redhat.com/content/dist/layered/rhel8/aarch64/rhocp/4.16/os/
        ppc64le: https://rhsm-pulp.corp.redhat.com/content/dist/layered/rhel8/ppc64le/rhocp/4.16/os/
        s390x: https://rhsm-pulp.corp.redhat.com/content/dist/layered/rhel8/s390x/rhocp/4.16/os/
        x86_64: https://rhsm-pulp.corp.redhat.com/content/dist/layered/rhel8/x86_64/rhocp/4.16/os/
    content_set:
      default: rhocp-4.16-for-rhel-8-x86_64-rpms
      aarch64: rhocp-4.16-for-rhel-8-aarch64-rpms
      ppc64le: rhocp-4.16-for-rhel-8-ppc64le-rpms
      s390x: rhocp-4.16-for-rhel-8-s390x-rpms
    reposync:
      enabled: false
