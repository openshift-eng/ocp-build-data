freeze_automation: false

name: omr-3.0
product: mirror-registry
version: auto

vars:
  MAJOR: 3
  MINOR: 0

arches:
- x86_64
- aarch64
- ppc64le
- s390x

konflux:
  arches:
  - x86_64
  - aarch64
  - ppc64le
  - s390x
  network_mode: hermetic
  cachi2:
    enabled: true
  build_attempts: 1

assemblies:
  enabled: true

mr_approvers:
  product_team: []

public_upstreams:
- private: "https://github.com/openshift-priv/quay-quay"
  public: "https://github.com/quay/quay"

urls:
  brewhub: https://brewhub.engineering.redhat.com/brewhub
  brew_image_host: registry-proxy.engineering.redhat.com
  brew_image_namespace: rh-osbs
