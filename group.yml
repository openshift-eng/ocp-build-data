freeze_automation: true
name: mta-8.2
csv_namespace: mta
product: mta
version: 8.2.0

vars:
  # The go versions used by the various CI builder images.
  # WARNING: When updating GO_* vars, update streams.yml so that streams referencing
  #          the corresponding {GO_*} vars to point to an image that actually provides
  #          the level of go specified by the variable.
  #          For example, if GO_LATEST=1.21, `image:` must point to a 1.21 golang.
  #             rhel-10-golang:
  #               aliases:
  #               - rhel-10-golang-{GO_LATEST}
  #               image: openshift/golang-builder:v1.21.3-202401221732.el9.g00c615b
  GO_LATEST: "1.24"
  GO_EXTRA: "1.24"  # There is no extra version at this time, so just duplicate latest.
  MAJOR: 4
  MINOR: 12

arches:
- x86_64
- aarch64

operator_image_ref_mode: manifest-list

# RPM lockfile is enabled by default when cachi2 is enabled with repos configured
# New Y-streams please run initial jenkins build with NETWORK_MODE set to open to populate build database
konflux:
  arches:
  - x86_64
  - aarch64
  cachi2:
    enabled: true
    gomod_version_patch: true
  sast:
    enabled: true
  network_mode: hermetic

# OCP versions to publish FBC builds to
OCP_TARGET_VERSIONS: [
  "4.12",
  "4.13",
  "4.14",
  "4.15",
  "4.16",
  "4.17",
  "4.18",
  "4.19",
  "4.20",
  "4.21",
]

assemblies:
  enabled: true

public_upstreams:
- private: "https://github.com/openshift-priv"
  public:  "https://github.com/migtools"

# Default distgit branch
branch: rhaos-{MAJOR}.{MINOR}-rhel-10

urls:
  brewhub: https://brewhub.engineering.redhat.com/brewhub
  brew_image_host: registry-proxy.engineering.redhat.com
  brew_image_namespace: rh-osbs

repos:
  rhel-10-baseos-rpms:
    conf:
      baseurl:
        aarch64: https://rhsm-pulp.corp.redhat.com/content/eus/rhel10/10.0/aarch64/baseos/os/
        x86_64: https://rhsm-pulp.corp.redhat.com/content/eus/rhel10/10.0/x86_64/baseos/os/
    content_set:
      default: rhel-10-for-x86_64-baseos-eus-rpms__10_DOT_0
      aarch64: rhel-10-for-aarch64-baseos-eus-rpms__10_DOT_0
    reposync:
      enabled: false

  rhel-10-appstream-rpms:
    conf:
      baseurl:
        aarch64: https://rhsm-pulp.corp.redhat.com/content/eus/rhel10/10.0/aarch64/appstream/os/
        x86_64: https://rhsm-pulp.corp.redhat.com/content/eus/rhel10/10.0/x86_64/appstream/os/
    content_set:
      default: rhel-10-for-x86_64-appstream-eus-rpms__10_DOT_0
      aarch64: rhel-10-for-aarch64-appstream-eus-rpms__10_DOT_0
    reposync:
      enabled: false

  rhel-10-codeready-builder-rpms:
    conf:
      baseurl:
        aarch64: https://rhsm-pulp.corp.redhat.com/content/eus/rhel10/10.0/aarch64/codeready-builder/os/
        x86_64: https://rhsm-pulp.corp.redhat.com/content/eus/rhel10/10.0/x86_64/codeready-builder/os/
    content_set:
      default: codeready-builder-for-rhel-10-x86_64-eus-rpms__10_DOT_0
      aarch64: codeready-builder-for-rhel-10-aarch64-eus-rpms__10_DOT_0
    reposync:
      enabled: false
