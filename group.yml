# Draft for ART-21248 — replace contents on branch oc-mirror-2.0
# Source of truth once applied: openshift-eng/ocp-build-data @ oc-mirror-2.0
#
# Notes:
# - Branch already exists (bootstrapped from installer-ove-ui-4.22) but still has
#   installer-ove-ui metadata; this file is the intended replacement.
# - Dockerfile path / git branch target depend on ART-21250 (upstream Containerfile).
# - For a single cross-compile image that drops all arch binaries under /releases/,
#   konflux.arches may only need x86_64. Ticket asked for all four arches — kept here;
#   revisit once Containerfile strategy is confirmed.

freeze_automation: false

name: oc-mirror-2.0
product: oc-mirror
version: "2.0"

vars:
  MAJOR: 2
  MINOR: 0

arches:
- x86_64
- aarch64
- ppc64le
- s390x

konflux:
  arches:
  - x86_64
  - aarch64
  - ppc64le
  - s390x
  network_mode: hermetic
  image_repo: quay.io/redhat-user-workloads/ocp-art-tenant/oc-mirror-2-0
  cachi2:
    enabled: true
    gomod_version_patch: true
  sast:
    enabled: true
  build_attempts: 1

assemblies:
  enabled: true

public_upstreams:
- private: "https://github.com/openshift-priv"
  public: "https://github.com/openshift"

urls:
  brewhub: https://brewhub.engineering.redhat.com/brewhub
  brew_image_host: registry-proxy.engineering.redhat.com
  brew_image_namespace: rh-osbs
