- conf:
    baseurl: # only arm is available for NVIDIA driver toolkit, but we need to define all arches to avoid build errors
      x86_64:  https://ocp-artifacts.engineering.redhat.com/pub/RHOCP/RHEL4NV/aarch64/os/
      aarch64: https://ocp-artifacts.engineering.redhat.com/pub/RHOCP/RHEL4NV/aarch64/os/
      ppc64le: https://ocp-artifacts.engineering.redhat.com/pub/RHOCP/RHEL4NV/aarch64/os/
      s390x:   https://ocp-artifacts.engineering.redhat.com/pub/RHOCP/RHEL4NV/aarch64/os/
    extra_options:
      gpgcheck: '1'
      priority: '10' # force kernels to come from NVIDIA instead of appstream
  content_set:
    aarch64: rhel-10-for-aarch64-nvidia-rpms
    optional: true
  name: rhel-10-nvidia
  reposync:
    enabled: false
  type: external
