# cri-o is NOT built by ART -- it is built externally and tagged into Brew candidate tags.
# This definition exists only so that cri-o appears in rpm_map, allowing assembly
# exclusions (exclude: true) to take effect in releases.yml.
mode: disabled
name: cri-o
content:
  source:
    git:
      branch:
        target: release-{MAJOR}.{MINOR}
      url: git@github.com:openshift-priv/cri-o.git
      web: https://github.com/openshift/cri-o
targets:
- rhaos-{MAJOR}.{MINOR}-rhel-9-candidate
- rhaos-{MAJOR}.{MINOR}-rhel-10-candidate
